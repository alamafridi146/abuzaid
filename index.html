<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abu Zaid Transportation — ERP</title>
<style>
:root{
  --dark:#0e2a1c;
  --green:#1a6e38;
  --green2:#2e8b4f;
  --accent:#7ed957;
  --bg:#f3f6f4;
  --card:#ffffff;
  --border:#e1e8e3;
  --text:#1c2621;
  --muted:#6c7c73;
  --danger:#c0392b;
  --warn:#e08a1e;
  --radius:10px;
  --surface:#ffffff;--thead:#eef6f0;--hover:#fafcfa;--heading:#0e2a1c;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:250px;flex-shrink:0;
  background:linear-gradient(180deg,var(--dark) 0%,#081910 100%);
  color:#dff2e6;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;
  transition:transform .25s ease;z-index:50;
}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
#sidebar .brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;}
#sidebar .brand .cname{font-weight:700;font-size:.92rem;line-height:1.25;}
#sidebar nav{padding:8px 0 30px;}
.nav-title{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.38);padding:14px 18px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:.9rem;color:#cfe9d8;border-left:3px solid transparent;cursor:pointer;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--accent);}
.nav-item .ic{width:18px;text-align:center;}

#main{margin-left:250px;flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 22px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:20;
}
#topbar h1{font-size:1.05rem;margin:0;font-weight:600;}
#menuToggle{display:none;background:none;border:none;font-size:1.3rem;color:var(--heading);}
#content{padding:22px;flex:1;}

/* ---------- Cards / KPI ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid-4,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.kpi-label{color:var(--muted);font-size:.82rem;margin-bottom:6px;}
.kpi-value{font-size:1.55rem;font-weight:700;color:var(--heading);}

/* ---------- Buttons ---------- */
.btn{border:1px solid transparent;border-radius:8px;padding:8px 14px;font-size:.86rem;font-weight:600;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--dark);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-danger{background:var(--surface);border-color:#f2c6c0;color:var(--danger);}
.btn-danger:hover{background:#fdf1ef;}
.btn-sm{padding:5px 10px;font-size:.78rem;}
.btn-icon{background:none;border:none;color:var(--muted);font-size:.95rem;padding:4px 6px;}
.btn-icon:hover{color:var(--green);}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.87rem;}
thead th{background:var(--thead);text-align:left;padding:10px 12px;color:var(--heading);font-weight:600;white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--hover);}
.empty-row td{text-align:center;color:var(--muted);padding:28px;}

/* ---------- Badges ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;color:#fff;}
.b-draft{background:#9aa6a0;}
.b-sent,.b-open{background:#2f7fd1;}
.b-partial{background:var(--warn);}
.b-paid{background:var(--green2);}
.b-overdue{background:var(--danger);}
.b-cancelled{background:#616161;}

/* ---------- Forms ---------- */
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
.form-row.one{grid-template-columns:1fr;}
@media(max-width:700px){.form-row{grid-template-columns:1fr;}}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;font-weight:600;}
input,select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
  font-size:.88rem;font-family:inherit;background:var(--surface);color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,139,79,.12);}
textarea{resize:vertical;min-height:60px;}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.search-box{display:flex;gap:8px;}
.search-box input{min-width:220px;}

/* ---------- Modal ---------- */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(10,25,17,.55);
  align-items:flex-start;justify-content:center;z-index:100;padding:30px 16px;overflow-y:auto;
}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:720px;padding:22px 24px;}
.modal.wide{max-width:980px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h2{font-size:1.1rem;margin:0;}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--muted);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}

/* ---------- Line items ---------- */
.line-table th,.line-table td{padding:6px 8px;}
.line-table input,.line-table select{padding:5px 7px;font-size:.82rem;}
.line-remove{color:var(--danger);background:none;border:none;font-size:1rem;}
.totals-box{margin-left:auto;width:280px;}
.totals-box .row{display:flex;justify-content:space-between;padding:4px 0;font-size:.88rem;}
.totals-box .row.total{font-weight:700;font-size:1rem;border-top:1px solid var(--border);margin-top:4px;padding-top:8px;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:20px;right:20px;background:var(--dark);color:#fff;
  padding:10px 18px;border-radius:8px;font-size:.85rem;opacity:0;transform:translateY(10px);
  transition:all .25s ease;z-index:200;
}
#toast.show{opacity:1;transform:translateY(0);}

/* ---------- Login ---------- */
#loginScreen{position:fixed;inset:0;background:#080c0a;z-index:300;overflow:hidden;}
#loginScreen.hide{display:none;}
#loginCanvas{position:absolute;inset:0;width:100%;height:100%;}
.lg-wrap{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;width:100%;height:100%;pointer-events:none;}
.lg-card{pointer-events:auto;background:rgba(15,23,18,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(76,175,80,.25);border-radius:20px;padding:40px 35px;width:90%;max-width:400px;box-shadow:0 15px 35px rgba(0,0,0,.8);text-align:center;}
.lg-card img{width:110px;height:auto;margin-bottom:15px;border-radius:12px;background:#fff;padding:6px;box-shadow:0 0 18px rgba(76,175,80,.5);}
.lg-card h2{color:#fff;font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:.5px;}
.lg-card .lg-sub{color:#4caf50;font-size:11px;font-weight:600;letter-spacing:2px;margin:0 0 25px;text-transform:uppercase;}
.lg-group{margin-bottom:20px;text-align:left;}
.lg-group label{color:#a5d6a7;font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;}
.lg-group input{padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(76,175,80,.3);border-radius:10px;color:#fff;font-size:14px;}
.lg-group input:focus{border-color:#4caf50;background:rgba(255,255,255,.08);box-shadow:0 0 12px rgba(76,175,80,.4);}
.lg-btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;font-size:15px;font-weight:600;margin-top:10px;transition:transform .2s,box-shadow .2s;}
.lg-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(76,175,80,.4);}
.lg-err{color:#ef9a9a;font-size:12px;min-height:16px;margin-top:12px;}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:6px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;}

/* ---------- Print ---------- */
@media print{
  #sidebar,#topbar,.toolbar,.no-print{display:none !important;}
  #main{margin-left:0;}
  body{background:#fff;}
}
.print-invoice{max-width:850px;margin:0 auto;background:#fff;padding:10px;}
.print-invoice table th{background:var(--dark);color:#fff;}

.section{display:none;}
.section.active{display:block;}
@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #menuToggle{display:block;}
}
.text-muted{color:var(--muted);}
.text-end{text-align:right;}
.mt-2{margin-top:10px;}
.hidden{display:none !important;}

/* ---------- v3: themes, logo stage, misc ---------- */
:root[data-dark]{color-scheme:dark;}
:root[data-dark] tr[style*="eef6f0"]{background:var(--thead) !important;}
.logo-stage{position:relative;height:150px;border-radius:var(--radius);margin-bottom:18px;overflow:hidden;
  background:linear-gradient(120deg,var(--dark),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;}
.logo-stage .stage-text{position:relative;z-index:1;padding:0 90px;}
.logo-stage .stage-text b{display:block;font-size:1.25rem;letter-spacing:.5px;}
.logo-stage .stage-text span{font-size:.82rem;opacity:.75;}
.logo-stage .fly-logo{position:absolute;left:0;top:0;width:68px;height:68px;object-fit:contain;background:#fff;
  border-radius:12px;padding:4px;box-shadow:0 0 22px rgba(126,217,87,.55);will-change:transform;z-index:2;}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.theme-sw{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid var(--border);border-radius:9px;
  background:var(--surface);color:var(--text);font-size:.82rem;font-weight:600;}
.theme-sw:hover{border-color:var(--green2);}
.theme-sw.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,139,79,.18);}
.theme-sw .sw{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.15);}

.b-approved{background:#7b57c9;}
/* invoice status stepper */
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 14px;padding:10px 12px;background:var(--thead);border:1px solid var(--border);border-radius:10px;}
.stepper .stp{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:.82rem;font-weight:600;}
.stepper .stp.done{background:var(--green2);border-color:var(--green2);color:#fff;}
.stepper .stp.cur{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 3px rgba(46,139,79,.2);}
.stepper .stp.go{border-color:var(--green2);color:var(--green);cursor:pointer;}
.stepper .stp.go:hover{background:var(--green);color:#fff;}
.stepper .stp:not(:disabled){cursor:pointer;}
.stepper .stp:disabled{cursor:default;}
.stepper .stp:disabled:not(.cur):not(.done){opacity:.55;}
.stepper .arrow{color:var(--muted);}
.stepper .spacer{margin-left:auto;}
/* customer page */
.cust-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start;}
@media(max-width:1150px){.cust-grid{grid-template-columns:1fr;}}
.cv-kpis{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px;}
.cv-kpis div{flex:1 1 140px;background:var(--thead);border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.cv-kpis span{display:block;font-size:.72rem;color:var(--muted);}
.cv-kpis b{font-size:1.05rem;color:var(--heading);}
.cv-h{font-size:.95rem;margin:16px 0 8px;}
tr.brow td{font-weight:700;background:var(--thead);}
.stmt-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 14px;}
@media(max-width:700px){.stmt-filters{grid-template-columns:repeat(2,minmax(0,1fr));}}
.xp-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
.xp-bar .xp-in{width:140px;}
.xp-bar .xp-sel{width:150px;}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <canvas id="loginCanvas"></canvas>
  <div class="lg-wrap"><div class="lg-card">
    <img id="loginLogo" src="" alt="Abu Zaid Transportation">
    <h2>ABU ZAID</h2><p class="lg-sub">Transportation</p>
    <form id="loginForm">
      <div class="lg-group"><label for="loginUser">Username</label><input id="loginUser" type="text" placeholder="Enter username" autocomplete="username" required></div>
      <div class="lg-group"><label for="loginPass">Password</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required></div>
      <button type="submit" class="lg-btn">Sign In</button>
      <div class="lg-err" id="loginErr"></div>
    </form>
  </div></div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <img id="sidebarLogo" src="" alt="logo">
      <div class="cname" id="sidebarCompanyName">Abu Zaid Transportation</div>
    </div>
    <nav id="navMenu"></nav>
  </aside>

  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="menuToggle" onclick="toggleSidebar()">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="btn btn-outline btn-sm" id="darkBtn" title="Dark / Light mode" onclick="setDark(!DB.ui.dark)">🌙</button>
        <span class="text-muted" style="font-size:.82rem;" id="topUser">admin</span>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

function loadDB(){

    if(!raw) { const d = defaultDB(); saveDB(d); return d; }
    return JSON.parse(raw);
  }catch(e){
    const d = defaultDB(); saveDB(d); return d;
  }
}
function saveDB(db){ 
  localStorage.setItem(DB_KEY, JSON.stringify(db)); 
  if (!isRemoteUpdate) {
    syncToFirebase(db);
  }
}

function nextNo(prefix, key){
  DB.seq[key] = (DB.seq[key]||0) + 1;
  saveDB(DB);

}
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- Utilities ---------------- */
function money(n){
  n = Number(n)||0;
  return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  const d = new Date(dateStr);
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function byId(arr, id){ return arr.find(x=>x.id===id) || null; }

function doLogin(){

/* =========================================================
   DASHBOARD
   ========================================================= */
function invoiceTotal(inv){
  return inv.lines.reduce((s,l)=> s + lineAmount(l), 0);
}
function invoiceTax(inv){
  return inv.lines.reduce((s,l)=> s + lineTax(l), 0);
}
function invoiceSubtotal(inv){
  return inv.lines.reduce((s,l)=> s + (Number(l.qty)||0)*(Number(l.rate)||0), 0);
}
function lineAmount(l){ return lineSub(l) + lineTax(l); }
function lineSub(l){ return (Number(l.qty)||0) * (Number(l.rate)||0); }
function lineTax(l){ return lineSub(l) * (Number(l.tax)||0) / 100; }

function invoicePaid(inv){
  return DB.paymentsReceived.filter(p=>p.invoiceId===inv.id).reduce((s,p)=>s+Number(p.amount||0),0);
}
function invoiceCredits(inv){ return (DB.creditNotes||[]).filter(c=>c.invoiceId===inv.id && c.status!=='cancelled').reduce((s,c)=>s+invoiceTotal(c),0); }
function invoiceBalance(inv){ return invoiceTotal(inv) - invoicePaid(inv) - invoiceCredits(inv); }
function billPaid(bill){
  return DB.paymentsMade.filter(p=>p.billId===bill.id).reduce((s,p)=>s+Number(p.amount||0),0);
}
function billBalance(bill){ return invoiceTotal(bill) - billPaid(bill); }

        ${recentInvoices.length ? recentInvoices.map(i=>`
          <tr>
            <td><a href="#" onclick="event.preventDefault();viewInvoice('${i.id}')">${esc(i.number)}</a></td>

function customerName(id){ const c = byId(DB.customers,id); return c ? (c.companyName || c.name) : '—'; }
function vendorName(id){ const v = byId(DB.vendors,id); return v ? (v.companyName || v.name) : '—'; }
function itemName(id){ const it = byId(DB.items,id); return it ? it.name : ''; }
function accountBalance(a){
  const txns = DB.transactions.filter(t=>t.accountId===a.id);
  const inSum = txns.filter(t=>t.type==='deposit').reduce((s,t)=>s+Number(t.amount||0),0);
  const outSum = txns.filter(t=>t.type==='withdrawal').reduce((s,t)=>s+Number(t.amount||0),0);
  return Number(a.opening||0) + inSum - outSum;
}
function customerBalance(cid){
  const inv = DB.invoices.filter(i=>i.customerId===cid && !['draft','cancelled'].includes(i.status)).reduce((s,i)=>s+invoiceBalance(i),0);
  const adv = DB.paymentsReceived.filter(p=>p.customerId===cid && !p.invoiceId).reduce((s,p)=>s+Number(p.amount||0),0);
  const cr = DB.creditNotes.filter(c=>c.customerId===cid && !c.invoiceId && c.status!=='cancelled').reduce((s,c)=>s+invoiceTotal(c),0);
  return inv - adv - cr;
}
function vendorBalance(vid){
  return DB.bills.filter(b=>b.vendorId===vid && !['draft','cancelled'].includes(b.status))
    .reduce((s,b)=>s+billBalance(b),0);
}

function lineRowHTML(l, sv){
  const num=(f,w)=>`<td style="width:${w}px;"><input type="number" step="0.01" value="${l[f]}" data-f="${f}" onchange="onLineFieldChange('${l.id}',this);recalcTotals();"></td>`;

  return `<tr data-lid="${l.id}">
    ${sv ? '' : `<td style="min-width:130px;"><select onchange="onLineItemPick('${l.id}', this)">${itemOptions(l.itemId)}</select></td>`}
    ${txt('description',sv?220:150,'Description')}
    ${sv ? txt('vehicle',130,'Vehicle type','vehList')+txt('service',150,'Service') : ''}
    ${num('qty',70)}${num('rate',90)}${num('tax',70)}
    <td style="width:90px;" class="text-end line-amt">﷼ ${money(lineAmount(l))}</td>
    <td style="width:36px;"><button type="button" class="line-remove" onclick="removeLine('${l.id}')">&times;</button></td>
  </tr>`;

let EDIT_LINES = [];
function renderLineTable(sv){
  const th = sv ? '<th>Description</th><th>Vehicle Type</th><th>Service</th>' : '<th>Item</th><th>Description</th>';
  return `<datalist id="vehList">${Object.values(VEHICLE_LABEL).map(v=>`<option value="${v}">`).join('')}</datalist>
  <table class="line-table" id="lineTable"><thead><tr>${th}<th>Qty</th><th>Rate</th><th>Tax %</th><th>Amount</th><th></th></tr></thead>
  <tbody id="lineTbody">${EDIT_LINES.map(l=>lineRowHTML(l,sv)).join('')}</tbody></table>
  <button type="button" class="btn btn-outline btn-sm mt-2" onclick="addLine(${sv})">+ Add Line</button>`;
}
function addLine(showVehicle){
  EDIT_LINES.push(emptyLine());
  document.getElementById('lineTbody').insertAdjacentHTML('beforeend', lineRowHTML(EDIT_LINES[EDIT_LINES.length-1], showVehicle));
  recalcTotals();
}
function removeLine(id){
  EDIT_LINES = EDIT_LINES.filter(l=>l.id!==id);
  const row = document.querySelector(`tr[data-lid="${id}"]`);
  if(row) row.remove();
  recalcTotals();
}
function onLineFieldChange(id, el){
  const l = EDIT_LINES.find(x=>x.id===id);
  if(!l) return;
  const f = el.dataset.f;
  l[f] = (f==='qty'||f==='rate'||f==='tax') ? Number(el.value)||0 : el.value;
  const row = el.closest('tr');
  const amtCell = row.querySelector('.line-amt');
  if(amtCell) amtCell.textContent = '﷼ ' + money(lineAmount(l));
}
function onLineItemPick(id, sel){
  const l = EDIT_LINES.find(x=>x.id===id);
  const it = byId(DB.items, sel.value);
  l.itemId = sel.value;
  if(it){
    l.description = it.name + (it.description? (' — ' + it.description) : '');
    l.rate = it.price;
    l.tax = it.tax;
    const row = sel.closest('tr');
    row.querySelector('[data-f="description"]').value = l.description;
    row.querySelector('[data-f="rate"]').value = l.rate;
    row.querySelector('[data-f="tax"]').value = l.tax;
    row.querySelector('.line-amt').textContent = '﷼ ' + money(lineAmount(l));
  }
  recalcTotals();
}
function recalcTotals(){
  const sub = EDIT_LINES.reduce((s,l)=>s+lineSub(l),0);
  const tax = EDIT_LINES.reduce((s,l)=>s+lineTax(l),0);
  const subEl = document.getElementById('totSub');
  const taxEl = document.getElementById('totTax');
  const grandEl = document.getElementById('totGrand');
  if(subEl) subEl.textContent = '﷼ ' + money(sub);
  if(taxEl) taxEl.textContent = '﷼ ' + money(tax);
  if(grandEl) grandEl.textContent = '﷼ ' + money(sub+tax);
}

/* ---------- ZATCA QR (TLV -> Base64 -> QR image) ----------
   DEMO MODE: tags 6-9 are generated with a local demo key (NOT a ZATCA-issued
   certificate). Good for learning/testing the QR structure only. */
function zatcaTLV(tag, value){
  const b = (value instanceof Uint8Array) ? value : new TextEncoder().encode(String(value));
  const out = new Uint8Array(2 + b.length);
  out[0] = tag; out[1] = b.length; out.set(b, 2);
  return out;
}
function b64(bytes){ let s=''; bytes.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); }
// WebCrypto returns raw r||s; convert to DER like ZATCA/ECDSA expects
function rawSigToDer(raw){
  const enc = (i)=>{ let v=Array.from(i); while(v.length>1 && v[0]===0) v.shift(); if(v[0]&0x80) v.unshift(0); return [0x02,v.length,...v]; };
  const r = enc(raw.slice(0,32)), s2 = enc(raw.slice(32));
  return new Uint8Array([0x30, r.length+s2.length, ...r, ...s2]);
}
let _zatcaDemoKey = null;
async function zatcaDemoKey(){
  if(!_zatcaDemoKey) _zatcaDemoKey = await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'}, true, ['sign','verify']);
  return _zatcaDemoKey;
}
async function zatcaBase64(inv){
  const co = DB.company;
  const ts = inv.date + 'T' + (inv.issueTime || '00:00:00') + 'Z';
  const total = invoiceTotal(inv).toFixed(2), vat = invoiceTax(inv).toFixed(2);
  const parts = [
    zatcaTLV(1, co.name || ''),
    zatcaTLV(2, co.vat || ''),
    zatcaTLV(3, ts),
    zatcaTLV(4, total),
    zatcaTLV(5, vat)
  ];
  let hash = inv.zatcaHash, sig = inv.zatcaSignature, pub = inv.zatcaPublicKey, stamp = inv.zatcaStampSig;
  if(!(hash && sig && pub && stamp)){
    // demo values
    const enc = new TextEncoder();
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode([inv.number,co.vat,ts,total,vat].join('|'))));
    const kp = await zatcaDemoKey();
    const rawSig = new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, kp.privateKey, digest));
    const der = rawSigToDer(rawSig);
    hash = b64(digest);
    sig = b64(der);
    pub = new Uint8Array(await crypto.subtle.exportKey('spki', kp.publicKey));
    stamp = der; // demo stand-in for the ZATCA CA stamp signature
  }
  parts.push(zatcaTLV(6, hash), zatcaTLV(7, sig), zatcaTLV(8, pub), zatcaTLV(9, stamp));
  const len = parts.reduce((a,c)=>a+c.length,0);
  const all = new Uint8Array(len); let o = 0;
  parts.forEach(a=>{ all.set(a,o); o+=a.length; });
  return b64(all);
}
async function zatcaQRDataUrl(inv){
  try{
    if(typeof QRCode === 'undefined') return '';
    const text = await zatcaBase64(inv);
    const box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
    document.body.appendChild(box);
    new QRCode(box, { text, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.L });
    const cv = box.querySelector('canvas');
    const url = cv ? cv.toDataURL('image/png') : '';
    document.body.removeChild(box);
    return url;
  }catch(e){ console.error('ZATCA QR error', e); return ''; }
}

    id:uid(), number: nextNo('INV','invoice'), customerId:qt.customerId, poRef:'',
    date:todayISO(), dueDate:addDays(todayISO(),30), terms:'net_30', status:'draft',
    notes:qt.notes||'', termsText:'Please remit payment as per the bank details below.',
    lines: JSON.parse(JSON.stringify(qt.lines))
  };
  DB.invoices.push(inv); qt.invoiceId = inv.id;
  saveDB(DB); closeModal();
  toast('Converted to invoice ' + inv.number);
  navigate('invoices');
}

function syncInvoiceStatus(id){
  const inv = byId(DB.invoices,id);
  if(!inv || inv.status==='cancelled' || inv.status==='draft') return;
  const settled = invoicePaid(inv)+invoiceCredits(inv);
  if(invoiceTotal(inv)>0 && invoiceBalance(inv)<=0.005) inv.status='paid';
  else if(settled>0) inv.status='partial';
  else if(inv.status==='paid'||inv.status==='partial') inv.status = inv.dueDate<todayISO() ? 'overdue' : ((inv.approvedOn && !inv.sentOn) ? 'approved' : 'sent');
}

function deletePaymentReceived(id){
  if(!confirm('Delete this payment?')) return;
  const p = byId(DB.paymentsReceived,id);
  DB.paymentsReceived = DB.paymentsReceived.filter(x=>x.id!==id);
  DB.transactions = DB.transactions.filter(t=>t.paymentId!==id);
  if(p && p.invoiceId) syncInvoiceStatus(p.invoiceId);
  saveDB(DB); navigate('paymentsReceived');
}
function unpaidInvoicesOf(cid){ return DB.invoices.filter(i=>i.customerId===cid && !['cancelled','draft'].includes(i.status) && invoiceBalance(i)>0.005); }
function refreshPRInvoiceOptions(sel){
  const cid = document.getElementById('f_customer').value;
  document.getElementById('f_invoice').innerHTML = '<option value="">Advance payment (no invoice yet)</option>' +
    unpaidInvoicesOf(cid).map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.number)} — Balance ﷼ ${money(invoiceBalance(i))}</option>`).join('');
  onPRInvoicePick();
}
function onPRInvoicePick(){
  const inv = byId(DB.invoices, document.getElementById('f_invoice').value);
  const hint = document.getElementById('prHint');
  if(inv){
    document.getElementById('f_amount').value = invoiceBalance(inv).toFixed(2);
    hint.textContent = 'Balance due ﷼ ' + money(invoiceBalance(inv)) + '. Enter a smaller amount for a part payment; any extra is saved as advance.';
  } else hint.textContent = 'Saved as advance. You can apply it to an invoice later from the Payments list.';
}
function openPaymentReceivedForm(invoiceId, presetCid){
  const pre = invoiceId ? byId(DB.invoices,invoiceId) : null;
  openModal(`
    <div class="modal-head"><h2>Add Payment</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="prForm">
      <div class="form-row">
        <div><label>Customer</label><select id="f_customer" required onchange="refreshPRInvoiceOptions()">${customerOptions(pre?pre.customerId:(presetCid||''))}</select></div>
        <div><label>Apply To</label><select id="f_invoice" onchange="onPRInvoicePick()"></select></div>
      </div>
      <div id="prHint" class="text-muted" style="font-size:.8rem;margin:-4px 0 12px;"></div>
      <div class="form-row">
        <div><label>Date</label><input id="f_date" type="date" value="${todayISO()}"></div>
        <div><label>Amount Received</label><input id="f_amount" type="number" step="0.01" value="0"></div>
      </div>
      <div class="form-row">
        <div><label>Deposit To (Bank / Cash Account)</label><select id="f_account" onchange="onPRAccountPick(this)">${acctOptions(DB.accounts[0]?DB.accounts[0].id:'')}</select></div>
        <div class="text-muted" style="font-size:.8rem;align-self:end;padding-bottom:8px;">${DB.accounts.length?'The amount is added to the selected account balance.':'No bank / cash account yet - add one in Bank Accounts.'}</div>
      </div>
      <div class="form-row">
        <div><label>Method</label><select id="f_method">${['bank_transfer','cash','cheque','card','other'].map(m=>`<option value="${m}">${m.replace('_',' ')}</option>`).join('')}</select></div>
        <div><label>Reference</label><input id="f_ref"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Payment</button>
      </div>
    </form>`);
  refreshPRInvoiceOptions(pre?pre.id:'');
  onPRAccountPick(document.getElementById('f_account'));
  if(pre) document.getElementById('f_amount').value = invoiceBalance(pre).toFixed(2);
  document.getElementById('prForm').onsubmit = function(e){
    e.preventDefault();
    const cid = document.getElementById('f_customer').value;
    if(!cid){ toast('Please select a customer'); return; }
    let amt = Number(document.getElementById('f_amount').value)||0;
    if(amt<=0){ toast('Enter the amount received'); return; }
    const invId = document.getElementById('f_invoice').value;
    const base = { customerId:cid, date:document.getElementById('f_date').value, method:document.getElementById('f_method').value, accountId:document.getElementById('f_account').value, reference:document.getElementById('f_ref').value };
    let extra = 0;
    if(invId){ const bal = invoiceBalance(byId(DB.invoices,invId)); if(amt>bal+0.005){ extra = amt-bal; amt = bal; } }
    const p = {...base, id:uid(), number:nextNo('PMT','payrecv'), invoiceId:invId, amount:amt};
    DB.paymentsReceived.push(p); syncPaymentTxn(p);
    if(extra>0){ const ex = {...base, id:uid(), number:nextNo('PMT','payrecv'), invoiceId:'', amount:extra, reference:'Excess of '+p.number}; DB.paymentsReceived.push(ex); syncPaymentTxn(ex); }
    if(invId) syncInvoiceStatus(invId);
    saveDB(DB); closeModal(); leaveTo('paymentsReceived');
    toast(extra>0 ? 'Saved. Extra ﷼ '+money(extra)+' kept as advance' : (invId?'Payment applied':'Advance payment saved'));
  };
}
function openApplyAdvance(pid){
  const p = byId(DB.paymentsReceived,pid);
  const list = unpaidInvoicesOf(p.customerId);
  openModal(`
    <div class="modal-head"><h2>Apply Advance ﷼ ${money(p.amount)}</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    ${list.length ? `<label>Invoice</label><select id="f_applyinv">${list.map(i=>`<option value="${i.id}">${esc(i.number)} — Balance ﷼ ${money(invoiceBalance(i))}</option>`).join('')}</select>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="applyAdvance('${pid}')">Apply</button></div>`
    : `<p class="text-muted">This customer has no unpaid invoices.</p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>`}`);
}
function applyAdvance(pid){
  const p = byId(DB.paymentsReceived,pid), inv = byId(DB.invoices, document.getElementById('f_applyinv').value);
  const bal = invoiceBalance(inv);
  if(Number(p.amount)>bal+0.005){
    const rest = {...p, id:uid(), number:nextNo('PMT','payrecv'), invoiceId:'', amount:Number(p.amount)-bal, reference:'Remaining of '+p.number};
    DB.paymentsReceived.push(rest);
    p.amount = bal; syncPaymentTxn(rest);
  }
  p.invoiceId = inv.id; syncPaymentTxn(p); syncInvoiceStatus(inv.id);
  saveDB(DB); closeModal(); leaveTo('paymentsReceived'); toast('Advance applied to '+inv.number);
}

      <tbody>
      ${rows.length ? rows.map(j=>{
        const debit = j.lines.reduce((s,l)=>s+Number(l.debit||0),0);
        const credit = j.lines.reduce((s,l)=>s+Number(l.credit||0),0);
        return `<tr>
          <td>${esc(j.number)}</td><td>${j.date}</td><td>${esc(j.reference||'')}</td>
          <td>﷼ ${money(debit)}</td><td>﷼ ${money(credit)}</td>
          <td>${debit===credit?'<span class="badge b-paid">Yes</span>':'<span class="badge b-overdue">No</span>'}</td>
          <td><button class="btn btn-danger btn-sm" onclick="confirmDelete('Delete journal ${esc(j.number)}?', ()=>{DB.journals=DB.journals.filter(x=>x.id!=='${j.id}');saveDB(DB);navigate('journals');})">Delete</button></td>

      }).join('') : `<tr class="empty-row"><td colspan="7">No journal entries yet.</td></tr>`}
      </tbody></table>
    </div>
  `;

let JOURNAL_LINES = [];
function journalLineRow(l){
  return `<tr data-jid="${l.id}">
    <td><select data-f="account">${journalAccountNames().map(a=>`<option ${a===l.account?'selected':''}>${esc(a)}</option>`).join('')}</select></td>
    <td><input data-f="description" value="${esc(l.description||'')}"></td>
    <td><input data-f="debit" type="number" step="0.01" value="${l.debit||0}"></td>
    <td><input data-f="credit" type="number" step="0.01" value="${l.credit||0}"></td>
    <td><button type="button" class="line-remove" onclick="removeJournalLine('${l.id}')">&times;</button></td>
  </tr>`;
}
function addJournalLine(){
  const l = { id:uid(), account:ACCOUNT_CHOICES[0], description:'', debit:0, credit:0 };
  JOURNAL_LINES.push(l);
  document.getElementById('jTbody').insertAdjacentHTML('beforeend', journalLineRow(l));
}
function removeJournalLine(id){
  JOURNAL_LINES = JOURNAL_LINES.filter(l=>l.id!==id);
  const row = document.querySelector(`tr[data-jid="${id}"]`);
  if(row) row.remove();
}
function openJournalForm(){
  JOURNAL_LINES = [ {id:uid(),account:ACCOUNT_CHOICES[0],description:'',debit:0,credit:0}, {id:uid(),account:ACCOUNT_CHOICES[1],description:'',debit:0,credit:0} ];
  openModal(`
    <div class="modal-head"><h2>New Manual Journal</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="jForm">
      <div class="form-row">
        <div><label>Date</label><input id="f_date" type="date" value="${todayISO()}"></div>
        <div><label>Reference</label><input id="f_ref"></div>
      </div>
      <label>Journal Lines</label>
      <table class="line-table"><thead><tr><th>Account</th><th>Description</th><th>Debit</th><th>Credit</th><th></th></tr></thead>
      <tbody id="jTbody">${JOURNAL_LINES.map(journalLineRow).join('')}</tbody></table>
      <button type="button" class="btn btn-outline btn-sm mt-2" onclick="addJournalLine()">+ Add Line</button>
      <div class="form-row one mt-2"><div><label>Notes</label><textarea id="f_notes"></textarea></div></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Journal</button>
      </div>
    </form>
  `, true);
  document.getElementById('jForm').onsubmit = function(e){
    e.preventDefault();
    document.querySelectorAll('#jTbody tr').forEach(row=>{
      const id = row.dataset.jid;
      const l = JOURNAL_LINES.find(x=>x.id===id);
      if(!l) return;
      l.account = row.querySelector('[data-f="account"]').value;
      l.description = row.querySelector('[data-f="description"]').value;
      l.debit = Number(row.querySelector('[data-f="debit"]').value)||0;
      l.credit = Number(row.querySelector('[data-f="credit"]').value)||0;
    });
    const j = { id:uid(), number: nextNo('JNL','journal'), date: document.getElementById('f_date').value,
      reference: document.getElementById('f_ref').value, notes: document.getElementById('f_notes').value,
      lines: JOURNAL_LINES };
    DB.journals.push(j);
    saveDB(DB); closeModal(); navigate('journals'); toast('Journal saved');
  };
}

function agingBuckets(items, dueField, balanceFn){
  const today = todayISO();
  const b = { current:0, d1_30:0, d31_60:0, d61_90:0, over90:0 };
  const rows = [];
  items.forEach(x=>{
    const bal = balanceFn(x);
    if(bal<=0) return;
    const days = Math.floor((new Date(today) - new Date(x[dueField])) / 86400000);
    let bucket;
    if(days<=0) bucket='current'; else if(days<=30) bucket='d1_30'; else if(days<=60) bucket='d31_60';
    else if(days<=90) bucket='d61_90'; else bucket='over90';
    b[bucket]+=bal;
    rows.push({x, days, bal, bucket});
  });
  return {b, rows};
}

/* ---------- Login canvas animation ---------- */
(function(){
  const cv = document.getElementById('loginCanvas'), ctx = cv.getContext('2d');
  const img = new Image(); img.src = LOGO_DATA_URL;
  const lg = {x:0,y:0,s:96}, t = {x:0,y:0}; let parts = [], run = false;
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  lg.x = t.x = innerWidth/2; lg.y = t.y = innerHeight/2;
  const mv = e => { const p = e.touches ? e.touches[0] : e; t.x = p.clientX; t.y = p.clientY; };
  ['mousemove','touchmove','touchstart'].forEach(ev=>addEventListener(ev, mv, {passive:true}));
  function drawLogo(x,y){
    ctx.save(); ctx.translate(x,y); ctx.shadowBlur = 25; ctx.shadowColor = '#4caf50';
    const s = lg.s; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-s/2,-s/2,s,s,14); else ctx.rect(-s/2,-s/2,s,s);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowBlur = 0; ctx.clip();
    if(img.complete && img.naturalWidth){
      const k = Math.min((s-10)/img.naturalWidth,(s-10)/img.naturalHeight), w = img.naturalWidth*k, h = img.naturalHeight*k;
      ctx.drawImage(img,-w/2,-h/2,w,h);
    }
    ctx.restore();
  }
  function loop(){
    if(document.getElementById('loginScreen').classList.contains('hide')){ run = false; return; }
    ctx.fillStyle = 'rgba(8,12,10,.35)'; ctx.fillRect(0,0,cv.width,cv.height);
    const dx = t.x-lg.x, dy = t.y-lg.y;
    if(Math.hypot(dx,dy) > 2){
      lg.x += dx*.08; lg.y += dy*.08;
      parts.push({x:lg.x,y:lg.y+20,size:Math.random()*5+2,a:1,c:['#4caf50','#81c784','#1b5e20','#a5d6a7'][Math.floor(Math.random()*4)]});
    }
    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i]; p.a -= .025;
      if(p.a<=0){ parts.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fillStyle = p.c; ctx.globalAlpha = p.a; ctx.fill(); ctx.globalAlpha = 1;
    }
    drawLogo(lg.x,lg.y);
    requestAnimationFrame(loop);
  }
  window.startLoginAnim = function(){ if(!run){ run = true; size(); loop(); } };
})();

/* ---------- Funny runaway Sign-In button (after a wrong password) ---------- */
(function(){
  const btn = document.querySelector('#loginForm .lg-btn');
  const screen = document.getElementById('loginScreen');
  const msgs = ['Pakar ke dikha! 😜','Itni jaldi nahi 😏','Miss ho gaya 🤭','Pehle sahi password 😎','Main yahan hoon 👻','Oye hoye 🏃'];
  const orig = btn.textContent;
  let active = false, ph = null, n = 0, lx = innerWidth/2, ly = innerHeight/2;
  btn.setAttribute('form','loginForm');            // keeps submitting even when moved out of the form

  function flee(px, py){
    const w = btn.offsetWidth, h = btn.offsetHeight, m = 10;
    let x, y, t = 0;
    do {
      x = m + Math.random()*Math.max(1, innerWidth  - w - 2*m);
      y = m + Math.random()*Math.max(1, innerHeight - h - 2*m);
    } while(++t < 40 && Math.hypot(x + w/2 - px, y + h/2 - py) < 240);
    btn.style.left = x + 'px';
    btn.style.top  = y + 'px';
    btn.style.transform = 'rotate(' + (Math.random()*24 - 12).toFixed(1) + 'deg)';
    btn.textContent = msgs[n++ % msgs.length];
  }
  function on(){
    if(!active){
      active = true;
      const r = btn.getBoundingClientRect();
      ph = document.createElement('div');           // keeps the empty space in the card
      ph.style.cssText = 'height:' + r.height + 'px;margin-top:10px;';
      btn.parentNode.insertBefore(ph, btn);
      screen.appendChild(btn);                      // leave the blurred card so position:fixed works
      btn.style.cssText = 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;margin:0;z-index:10;'
        + 'transition:left .25s ease,top .25s ease,width .25s ease,transform .25s ease;';
      btn.getBoundingClientRect();                  // force reflow so the first jump animates
      btn.style.width = '170px';
    }
    flee(lx, ly);
  }
  function off(){
    if(!active) return;
    active = false;
    btn.removeAttribute('style');
    btn.textContent = orig;
    ph.replaceWith(btn);
    ph = null;
  }
  document.addEventListener('pointermove', e => {
    lx = e.clientX; ly = e.clientY;
    if(!active) return;
    const r = btn.getBoundingClientRect();
    if(Math.hypot(lx - (r.left + r.width/2), ly - (r.top + r.height/2)) < 110) flee(lx, ly);
  });
  btn.addEventListener('pointerdown', e => { if(active){ lx = e.clientX; ly = e.clientY; flee(lx, ly); } });
  btn.addEventListener('click', e => {              // mouse/touch clicks are dodged; Enter key (detail 0) still works
    if(active && e.detail > 0){ e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
  ['loginUser','loginPass'].forEach(id => document.getElementById(id).addEventListener('input', off));
  window.azRunaway = { on, off };
})();

/* ---------- Ledger engine (drives Chart of Accounts + Trial Balance) ---------- */
const ACCT_TYPES = { asset:'Asset', bank:'Bank', cash:'Cash', liability:'Liability', equity:'Equity', income:'Income', expense:'Expense', other:'Other' };
const SYSTEM_ACCOUNTS = [
  ['1000','Cash','cash'],['1010','Bank','bank'],['1100','Accounts Receivable','asset'],['1150','Vendor Advances','asset'],['1200','VAT Receivable','asset'],
  ['2000','Accounts Payable','liability'],['2050','Customer Advances','liability'],['2100','VAT Payable','liability'],
  ['3000','Opening Balance Equity','equity'],
  ['4000','Sales Revenue','income'],['4100','Sales Returns (Credit Notes)','income'],['4200','Other Income','income'],
  ['5000','Purchases (Bills)','expense'],['6010','Fuel Expense','expense'],['6020','Vehicle Maintenance Expense','expense'],['6030','Salary Expense','expense'],
  ['6040','Rent Expense','expense'],['6050','Insurance Expense','expense'],['6060','Office Supplies Expense','expense'],['6900','Other Expense','expense']
];
const EXP_ACCOUNT = { fuel:'Fuel Expense', maintenance:'Vehicle Maintenance Expense', salary:'Salary Expense', rent:'Rent Expense', insurance:'Insurance Expense', office:'Office Supplies Expense', other:'Other Expense' };
function journalAccountNames(){
  const s = new Set(ACCOUNT_CHOICES); DB.coa.forEach(a=>s.add(a.name)); return [...s];
}
function buildEntries(){
  const E = [], live = x=>!['draft','cancelled'].includes(x.status), cashOf = m=>m==='cash'?'Cash':'Bank';
  const add = (date,account,dr,cr)=>{ dr=+dr||0; cr=+cr||0; if(dr||cr) E.push({date:date||'0000-00-00',account,dr,cr}); };
  const pair = (date,d,c,amt)=>{ amt=+amt||0; if(amt>=0){ add(date,d,amt,0); add(date,c,0,amt); } else { add(date,d,0,-amt); add(date,c,-amt,0); } };
  DB.invoices.filter(live).forEach(i=>{ add(i.date,'Accounts Receivable',invoiceTotal(i),0); add(i.date,'Sales Revenue',0,invoiceSubtotal(i)); add(i.date,'VAT Payable',0,invoiceTax(i)); });
  DB.creditNotes.filter(c=>c.status!=='cancelled').forEach(c=>{ add(c.date,'Sales Returns (Credit Notes)',invoiceSubtotal(c),0); add(c.date,'VAT Payable',invoiceTax(c),0); add(c.date,'Accounts Receivable',0,invoiceTotal(c)); });
  DB.paymentsReceived.forEach(p=>pair(p.date,(p.accountId&&byId(DB.accounts,p.accountId))?ledgerOfAcct(p.accountId):cashOf(p.method),p.invoiceId?'Accounts Receivable':'Customer Advances',p.amount));
  DB.bills.filter(live).forEach(b=>{ add(b.date,'Purchases (Bills)',invoiceSubtotal(b),0); add(b.date,'VAT Receivable',invoiceTax(b),0); add(b.date,'Accounts Payable',0,invoiceTotal(b)); });
  DB.paymentsMade.forEach(p=>pair(p.date,p.billId?'Accounts Payable':'Vendor Advances',cashOf(p.method),p.amount));
  DB.expenses.forEach(x=>pair(x.date,EXP_ACCOUNT[x.category]||'Other Expense','Cash',x.amount));
  DB.accounts.forEach(a=>{
    const acc = a.type==='cash'?'Cash':'Bank';
    pair(null,acc,'Opening Balance Equity',a.opening);
    DB.transactions.filter(t=>t.accountId===a.id && !t.paymentId).forEach(t=>{ if(t.type==='deposit') pair(t.date,acc,'Other Income',t.amount); else pair(t.date,'Other Expense',acc,t.amount); });
  });
  DB.coa.forEach(a=>{ const o = Number(a.opening)||0; if(!o) return;
    const dSide = ['asset','bank','cash','expense'].includes(a.type);
    pair(null, dSide?a.name:'Opening Balance Equity', dSide?'Opening Balance Equity':a.name, o); });
  DB.journals.forEach(j=>j.lines.forEach(l=>add(j.date,l.account,l.debit,l.credit)));
  return E;
}
function buildLedger(asOf){
  asOf = asOf || '9999-12-31'; const map = {};
  SYSTEM_ACCOUNTS.forEach(([code,name,type])=>map[name]={code,name,type,dr:0,cr:0,system:true});
  DB.coa.forEach(a=>map[a.name]={code:a.code||'',name:a.name,type:a.type,dr:0,cr:0,custom:true,id:a.id,opening:a.opening});
  buildEntries().filter(e=>e.date<=asOf).forEach(e=>{ const a = map[e.account] || (map[e.account]={code:'',name:e.account,type:'other',dr:0,cr:0}); a.dr+=e.dr; a.cr+=e.cr; });
  return Object.values(map).map(a=>({...a,net:a.dr-a.cr})).sort((a,b)=>(a.code||'9999').localeCompare(b.code||'9999')||a.name.localeCompare(b.name));
}
function drCr(net){ return '﷼ '+money(Math.abs(net))+(Math.abs(net)<0.005?'':(net>0?' Dr':' Cr')); }

function renderVAT(){

  const sT = sum(inv,invoiceSubtotal), sV = sum(inv,invoiceTax), cT = sum(cn,invoiceSubtotal), cV = sum(cn,invoiceTax), pT = sum(bl,invoiceSubtotal), pV = sum(bl,invoiceTax);
  const outV = sV-cV, net = outV-pV, months = {};
  const bump=(d,k,v)=>{ const m=d.slice(0,7); (months[m]=months[m]||{out:0,inp:0})[k]+=v; };
  inv.forEach(i=>bump(i.date,'out',invoiceTax(i))); cn.forEach(c=>bump(c.date,'out',-invoiceTax(c))); bl.forEach(b=>bump(b.date,'inp',invoiceTax(b)));
  document.getElementById('reportOut').innerHTML = `

      <tr><td><strong>Output VAT (collected)</strong></td><td class="text-end"><strong>﷼ ${money(sT-cT)}</strong></td><td class="text-end"><strong>﷼ ${money(outV)}</strong></td></tr>
      <tr><td><strong>Input VAT (paid on purchases / bills)</strong></td><td class="text-end"><strong>﷼ ${money(pT)}</strong></td><td class="text-end"><strong>﷼ ${money(pV)}</strong></td></tr>

    </tbody></table></div>

    ${Object.keys(months).sort().map(m=>`<tr><td>${m}</td><td class="text-end">﷼ ${money(months[m].out)}</td><td class="text-end">﷼ ${money(months[m].inp)}</td><td class="text-end">﷼ ${money(months[m].out-months[m].inp)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="4">No VAT transactions in this period.</td></tr>'}
    </tbody></table></div>
    <p class="text-muted" style="font-size:.78rem;">Draft and cancelled documents are excluded. Expenses recorded without a bill carry no input VAT.</p>`;
}

/* ---------- Dashboard charts ---------- */
function shortNum(n){ return n>=1e6 ? (n/1e6).toFixed(1)+'M' : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+'k' : String(Math.round(n)); }
function barChart(labels, series){
  const W=460,H=220,pl=44,pb=28,pt=10,pr=8, max=Math.max(1,...series.flatMap(s=>s.vals));
  const gw=(W-pl-pr)/labels.length, bw=Math.min(28,(gw-10)/series.length); let g='';
  for(let i=0;i<=4;i++){ const y=pt+(H-pt-pb)*(1-i/4); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e1e8e3"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#6c7c73">${shortNum(max*i/4)}</text>`; }
  labels.forEach((lb,i)=>{
    const x0=pl+gw*i+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{ const h=(H-pt-pb)*s.vals[i]/max; g+=`<rect x="${x0+bw*j}" y="${H-pb-h}" width="${bw-2}" height="${h}" rx="3" fill="${s.color}"><title>${s.name}: ﷼ ${money(s.vals[i])}</title></rect>`; });
    g+=`<text x="${pl+gw*i+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#6c7c73">${lb}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;
}

/* ---------- Dashboard: continuously moving logo ---------- */
function startLogoStage(){
  const st = document.getElementById('logoStage'); if(!st) return;
  const lg = st.querySelector('.fly-logo');
  let x = 30, y = 20, vx = 130, vy = 85, last = performance.now();
  function step(now){
    if(!document.body.contains(st)) return;          // stops when leaving the dashboard
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const W = Math.max(0, st.clientWidth - lg.offsetWidth), H = Math.max(0, st.clientHeight - lg.offsetHeight);
    x += vx*dt; y += vy*dt;
    if(x<=0){ x=0; vx=Math.abs(vx); } else if(x>=W){ x=W; vx=-Math.abs(vx); }
    if(y<=0){ y=0; vy=Math.abs(vy); } else if(y>=H){ y=H; vy=-Math.abs(vy); }
    lg.style.transform = 'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(Math.sin(now/450)*10).toFixed(1)+'deg)';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- CSV helpers ---------- */
function csvCell(v){ v = (v===undefined||v===null) ? '' : String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function downloadCSV(name, rows){
  const blob = new Blob(['﻿'+toCSV(rows)], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const cnt = ch => first.split(ch).length;
  const delim = cnt(';')>cnt(',') ? ';' : (cnt('\t')>cnt(',') ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q = true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; rows.push(row); row=[]; }
    else cur += c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  const clean = rows.filter(r=>r.some(x=>String(x).trim()!==''));
  if(!clean.length) return [];
  const head = clean[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim());
  return clean.slice(1).map(r=>{ const o = {}; head.forEach((h,i)=>{ o[h] = (r[i]===undefined?'':r[i]).trim(); }); return o; });
}
function pick(o, ...names){ for(const n of names){ if(o[n]!==undefined && o[n]!=='') return o[n]; } return ''; }
function firstOf(rows, ...names){ for(const r of rows){ const v = pick(r,...names); if(v) return v; } return ''; }
function normDate(s, fallback){
  s = (s||'').trim(); if(!s) return fallback;
  let m;
  if((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');   // DD/MM/YYYY
  const d = new Date(s);
  return isNaN(d) ? fallback : d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normStatus(s, allowed, def){
  s = (s||'').toLowerCase().trim().replace(/\s+/g,'_'); if(s==='partially_paid') s = 'partial';
  return allowed.includes(s) ? s : def;
}
function uniqueNo(prefix, key, list){ let n; do { n = nextNo(prefix,key); } while(list.some(x=>x.number===n)); return n; }
function bumpSeq(key, num){ const m = (num||'').match(/(\d+)\s*$/); if(m) DB.seq[key] = Math.max(DB.seq[key]||0, parseInt(m[1],10)); }
function num(s){ const n = parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; }
function rowToLine(o){
  const desc = pick(o,'description','item description','item'), vehicle = pick(o,'vehicle type','vehicle'), service = pick(o,'service');
  const q = num(pick(o,'qty','quantity')), r = num(pick(o,'rate','price','unit price')), t = num(pick(o,'tax','tax rate'));
  if(!desc && !vehicle && !service && r===null) return null;
  return { id:uid(), itemId:'', description:desc, vehicle, service, qty:q===null?1:q, rate:r===null?0:r, tax:t===null?DB.company.taxRate:t };
}
function groupRows(rows, numKeys, custKeys, dateKeys){
  const map = new Map();
  rows.forEach(o=>{
    const n = pick(o,...numKeys), key = n ? 'n:'+n : 'c:'+pick(o,...custKeys).toLowerCase()+'|'+pick(o,...dateKeys);
    if(!map.has(key)) map.set(key,{num:n, rows:[]});
    map.get(key).rows.push(o);
  });
  return [...map.values()];
}
function findOrCreateCustomer(name){
  const n = name.trim().toLowerCase();
  let c = DB.customers.find(x=>(x.companyName||'').toLowerCase()===n || (x.name||'').toLowerCase()===n);
  if(c) return {c, created:false};
  c = { id:uid(), name:name.trim(), companyName:'', phone:'', email:'', vat:'', crn:'', address:'', city:'', country:'Saudi Arabia', active:true, notes:'' };
  DB.customers.push(c); return {c, created:true};
}

function docCsvRows(d, head, tail){

/* ---------- Import ---------- */
function importCustomers(rows){
  const R = {added:0, updated:0, skipped:0, notes:[]};
  rows.forEach(o=>{
    const name = pick(o,'name','contact name','customer name','customer'), company = pick(o,'company','company name');
    if(!name && !company){ R.skipped++; return; }
    const nm = name || company;
    const vals = { phone:pick(o,'phone','mobile'), email:pick(o,'email'), vat:pick(o,'vat number','vat'), crn:pick(o,'crn number','crn'),
      address:pick(o,'address'), city:pick(o,'city'), country:pick(o,'country'), notes:pick(o,'notes') };
    const st = pick(o,'status').toLowerCase(), active = !['inactive','0','no','false'].includes(st);
    const ex = DB.customers.find(c=>(c.name||'').toLowerCase()===nm.toLowerCase() && (c.companyName||'').toLowerCase()===company.toLowerCase());
    if(ex){ Object.keys(vals).forEach(k=>{ if(vals[k]) ex[k] = vals[k]; }); if(st) ex.active = active; R.updated++; }
    else { DB.customers.push({ id:uid(), name:nm, companyName:company, phone:'', email:'', vat:'', crn:'', address:'', city:'', country:vals.country||'Saudi Arabia', notes:'', ...Object.fromEntries(Object.entries(vals).filter(([k,v])=>v)), active }); R.added++; }
  });
  return R;
}
function importQuotes(rows){
  const R = {added:0, skipped:0, newCust:0, notes:[]};
  groupRows(rows, ['quote no','quote number','quote','number','no'], ['customer','customer name'], ['date','quote date']).forEach(g=>{
    const custName = firstOf(g.rows,'customer','customer name');
    if(!custName){ R.skipped++; return; }
    if(g.num && DB.quotes.some(q=>q.number.toLowerCase()===g.num.toLowerCase())){ R.skipped++; R.notes.push('Quote '+g.num+' already exists — skipped'); return; }
    const lines = g.rows.map(rowToLine).filter(Boolean);
    if(!lines.length){ R.skipped++; R.notes.push((g.num||custName)+': no line items — skipped'); return; }
    const cu = findOrCreateCustomer(custName); if(cu.created) R.newCust++;
    const date = normDate(firstOf(g.rows,'date','quote date'), todayISO());
    DB.quotes.push({ id:uid(), number:g.num || uniqueNo('QUO','quote',DB.quotes), customerId:cu.c.id, date,
      expiry:normDate(firstOf(g.rows,'expiry date','expiry','valid until'), addDays(date,15)),
      status:normStatus(firstOf(g.rows,'status'), ['draft','sent','paid','cancelled'], 'draft'), notes:firstOf(g.rows,'notes'), lines });
    bumpSeq('quote', g.num); R.added++;
  });
  return R;
}
function importInvoices(rows){
  const R = {added:0, skipped:0, newCust:0, notes:[]}; let softened = 0;
  groupRows(rows, ['invoice no','invoice number','invoice','number','no'], ['customer','customer name'], ['date','invoice date']).forEach(g=>{
    const custName = firstOf(g.rows,'customer','customer name');
    if(!custName){ R.skipped++; return; }
    if(g.num && DB.invoices.some(i=>i.number.toLowerCase()===g.num.toLowerCase())){ R.skipped++; R.notes.push('Invoice '+g.num+' already exists — skipped'); return; }
    const lines = g.rows.map(rowToLine).filter(Boolean);
    if(!lines.length){ R.skipped++; R.notes.push((g.num||custName)+': no line items — skipped'); return; }
    const cu = findOrCreateCustomer(custName); if(cu.created) R.newCust++;
    const date = normDate(firstOf(g.rows,'date','invoice date'), todayISO());
    let terms = firstOf(g.rows,'terms').toLowerCase().replace(/\s+/g,'_'); if(!TERMS_LABEL[terms]) terms = 'net_30';
    let st = normStatus(firstOf(g.rows,'status'), ['draft','sent','partial','paid','overdue','cancelled'], 'draft');
    if(st==='paid' || st==='partial'){ st = 'sent'; softened++; }
    DB.invoices.push({ id:uid(), number:g.num || uniqueNo('INV','invoice',DB.invoices), customerId:cu.c.id,
      poRef:firstOf(g.rows,'order po reference','order number','po reference','po'), date,
      dueDate:normDate(firstOf(g.rows,'due date'), addDays(date, TERMS_DAYS_MAP[terms])), terms, status:st,
      notes:firstOf(g.rows,'notes'), termsText:getTpl('invoice').terms, lines, issueTime:new Date().toTimeString().slice(0,8) });
    bumpSeq('invoice', g.num); R.added++;
  });
  if(softened) R.notes.push(softened+' invoice(s) marked Paid/Partial in the file were set to "Sent" — record payments in Payments Received to settle them.');
  return R;
}

function runImport(kind){

  rd.onload = function(){

    if(!rows.length){ toast('No data rows found in the file'); return; }
    const R = kind==='customers' ? importCustomers(rows) : kind==='quotes' ? importQuotes(rows) : importInvoices(rows);

    if(R.updated!==undefined) parts.push('<b>'+R.updated+'</b> updated');

      <div class="modal-head"><h2>Import complete</h2><button class="modal-close" onclick="closeModal();navigate('${IO[kind].page}')">&times;</button></div>

  };

}

function docMeta(kind, d){
  const inv = byId(DB.invoices, d.invoiceId), st = STATUS_LABEL[d.status] || d.status || '';
  switch(kind){
    case 'invoice'   : return [['Order Number',d.poRef||''],['Invoice Date',d.date],['Due Date',d.dueDate],['Terms',TERMS_LABEL[d.terms]||'']];
    case 'quote'     : return [['Quote Date',d.date],['Expiry Date',d.expiry||''],['Status',st]];
    case 'order'     : return [['Order Date',d.date],['Status',st]];
    case 'creditNote': return [['Date',d.date],['Against Invoice',inv?inv.number:'—'],['Reason',d.reason||'']];
    case 'bill'      : return [['Order Number',d.poRef||''],['Bill Date',d.date],['Due Date',d.dueDate],['Terms',TERMS_LABEL[d.terms]||'']];
    default          : return [['Order Date',d.date],['Status',st]];
  }
}
function docTotals(kind, d){
  const rows = [['Sub Total',invoiceSubtotal(d),''],['VAT',invoiceTax(d),''],['Total',invoiceTotal(d),'b']];
  if(kind==='invoice'){ if(invoiceCredits(d)) rows.push(['Credit Notes',-invoiceCredits(d),'']); rows.push(['Payments Received',-invoicePaid(d),'']); rows.push(['Balance Due',invoiceBalance(d),'b hl']); }
  if(kind==='bill'){ rows.push(['Payments Made',-billPaid(d),'']); rows.push(['Balance Due',billBalance(d),'b hl']); }
  return rows;
}

/* =========================================================
   EXPORT ENGINE — real .xlsx (no library) + printable PDF
   ========================================================= */
const _crcT = (function(){ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320^(c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=_crcT[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const u16 = v=>[v&255,(v>>8)&255], u32 = v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(f=>{
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const local = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0)]);
    parts.push(local, name, f.data);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += local.length + name.length + size;
  });
  let cdSize = 0; central.forEach(c=>cdSize += c.length);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, end]);
}
function xlsxColName(i){ let s='', n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function xmlEsc(s){ return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const XLSX_STYLE = { b:1, m:2, bm:3, h:4, t:5 };
function xlsxSheetXML(sheet){
  const rows = sheet.rows, widths = [];
  rows.forEach(r=>r.forEach((c,i)=>{
    if(c===null||c===undefined) return;
    const v = (typeof c==='object') ? c.v : c;
    const len = typeof v==='number' ? money(v).length : String(v).length;
    widths[i] = Math.max(widths[i]||0, len);
  }));
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x += '<cols>' + widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${Math.min(Math.max((w||0)+3,11),46)}" customWidth="1"/>`).join('') + '</cols><sheetData>';
  rows.forEach((r,ri)=>{
    x += `<row r="${ri+1}">`;
    r.forEach((c,ci)=>{
      if(c===null||c===undefined||c==='') return;
      const v = (typeof c==='object') ? c.v : c, st = (typeof c==='object' && c.s) ? XLSX_STYLE[c.s] : 0, ref = xlsxColName(ci)+(ri+1);
      if(typeof v==='number') x += `<c r="${ref}" s="${st||0}"><v>${v}</v></c>`;
      else x += `<c r="${ref}" s="${st||0}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function makeXLSX(sheets){
  const enc = new TextEncoder(), files = [], add = (name,str)=>files.push({name, data:enc.encode(str)});
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  add('[Content_Types].xml', H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  add('_rels/.rels', H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  add('xl/workbook.xml', H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + sheets.map((s,i)=>`<sheet name="${xmlEsc(String(s.name).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('') + '</sheets></workbook>');
  add('xl/_rels/workbook.xml.rels', H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
    + `<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add('xl/styles.xml', H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts>'
    + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1A6E38"/><bgColor indexed="64"/></patternFill></fill></fills>'
    + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="4" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'
    + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  sheets.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`, xlsxSheetXML(s)));
  const blob = zipStore(files);
  return new Blob([blob], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function downloadBlob(name, blob){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 800);
}
function safeFile(s){ return String(s||'report').replace(/[\\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,80); }

/* ---- report "model": { file, title, meta:[[k,v]], summary:[[k,v]], sections:[{heading, cols:[{h,num}], rows:[cells | {b:true,c:cells}]}] } ---- */
function modelToRows(m){
  const R = [], co = DB.company || {};
  R.push([{v:co.name||'Abu Zaid Transportation', s:'t'}]);
  R.push([{v:m.title, s:'b'}]);
  R.push([]);
  m.meta.forEach(([k,v])=>R.push([{v:k,s:'b'}, v]));
  if(m.summary && m.summary.length){ R.push([]); m.summary.forEach(([k,v])=>R.push([{v:k,s:'b'}, typeof v==='number' ? {v, s:'bm'} : v])); }
  m.sections.forEach(sec=>{
    R.push([]);
    if(sec.heading) R.push([{v:sec.heading, s:'b'}]);
    R.push(sec.cols.map(c=>({v:c.h, s:'h'})));
    sec.rows.forEach(r=>{
      const b = !Array.isArray(r) && r.b, cells = Array.isArray(r) ? r : r.c;
      R.push(cells.map(v=> typeof v==='number' ? {v, s:b?'bm':'m'} : (v===null||v===undefined||v==='') ? null : {v:String(v), s:b?'b':undefined}));
    });
  });
  R.push([]); R.push(['Amounts in SAR. Generated ' + new Date().toLocaleString()]);
  return R;
}
function exportModelXLSX(m){
  downloadBlob(safeFile(m.file)+'.xlsx', makeXLSX([{ name: m.sheet || 'Report', rows: modelToRows(m) }]));
  toast('Excel file downloaded');
}

function viewCustomer(id){

  currentPage = 'customers';

function presetRange(p){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const iso = d => { const t = new Date(d.getTime() - d.getTimezoneOffset()*60000); return t.toISOString().slice(0,10); };
  switch(p){
    case 'this_month':   return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
    case 'last_month':   return [iso(new Date(y,m-1,1)), iso(new Date(y,m,0))];
    case 'this_quarter': { const q = Math.floor(m/3)*3; return [iso(new Date(y,q,1)), iso(new Date(y,q+3,0))]; }
    case 'this_year':    return [iso(new Date(y,0,1)), iso(new Date(y,11,31))];
    case 'last_year':    return [iso(new Date(y-1,0,1)), iso(new Date(y-1,11,31))];
    default:             return ['',''];
  }
}

function statementModel(c){
  let from = CUSTVIEW.from, to = CUSTVIEW.to; const filter = CUSTVIEW.filter;
  if(from && to && from>to){ const t = from; from = to; to = t; }
  const inR = d => (!from || d>=from) && (!to || d<=to);
  const cname = c.companyName || c.name;
  const meta = [['Customer', cname]];
  if(c.companyName && c.name && c.name!==c.companyName) meta.push(['Contact', c.name]);
  const addr = [c.address,c.city,c.country].filter(Boolean).join(', ');
  if(addr) meta.push(['Address', addr]);
  if(c.vat) meta.push(['VAT No.', c.vat]);
  if(c.crn) meta.push(['CRN', c.crn]);
  if(c.phone) meta.push(['Phone', c.phone]);
  if(c.email) meta.push(['Email', c.email]);
  meta.push(['Period', (from||to) ? ((from||'Beginning')+'  to  '+(to||'Today')) : 'All dates']);
  meta.push(['Showing', filter==='unpaid' ? 'Unpaid invoices only' : 'All invoices & payments']);
  const base = { file:'Statement-'+cname+'-'+todayISO(), title:'Statement of Accounts', sheet:'Statement', meta };

  const liveInv = DB.invoices.filter(i=>i.customerId===c.id && !['draft','cancelled'].includes(i.status));
  if(filter==='unpaid'){
    const list = liveInv.filter(i=>invoiceBalance(i)>0.005 && inR(i.date)).sort((a,b)=>a.date.localeCompare(b.date));
    const today = todayISO();
    const tot = list.reduce((s,i)=>s+invoiceTotal(i),0), bal = list.reduce((s,i)=>s+invoiceBalance(i),0);
    const overdue = list.filter(i=>i.dueDate<today).reduce((s,i)=>s+invoiceBalance(i),0);
    const unused = DB.paymentsReceived.filter(p=>p.customerId===c.id && !p.invoiceId).reduce((s,p)=>s+(Number(p.amount)||0),0)
      + (DB.creditNotes||[]).filter(x=>x.customerId===c.id && !x.invoiceId && x.status!=='cancelled').reduce((s,x)=>s+invoiceTotal(x),0);
    const summary = [['Unpaid Invoices', String(list.length)], ['Total Invoiced', tot], ['Paid / Credited', tot-bal], ['Overdue', overdue], ['Balance Due', bal]];
    if(unused>0.005) summary.push(['Unused Payments / Credits', unused]);
    return { ...base, summary, sections:[{
      empty:'No unpaid invoices in this period.',
      cols:[{h:'Date'},{h:'Invoice #'},{h:'Due Date'},{h:'Invoice Amount',num:1},{h:'Paid / Credited',num:1},{h:'Balance Due',num:1}],
      rows: list.length ? list.map(i=>[i.date, i.number, i.dueDate, invoiceTotal(i), invoiceTotal(i)-invoiceBalance(i), invoiceBalance(i)]).concat([{b:true,c:['','Total','',tot,tot-bal,bal]}]) : []
    }]};
  }
  const rank = { Invoice:0, 'Credit Note':1, Payment:2 };
  const ent = [];
  liveInv.forEach(i=>ent.push({date:i.date, type:'Invoice', ref:i.number, det:'Due '+i.dueDate, debit:invoiceTotal(i), credit:0}));
  DB.paymentsReceived.filter(p=>p.customerId===c.id).forEach(p=>{
    const inv = byId(DB.invoices,p.invoiceId);
    ent.push({date:p.date, type:'Payment', ref:p.number, det:(inv?'Applied to '+inv.number:'Advance / unused')+(p.reference?' · Ref '+p.reference:''), debit:0, credit:Number(p.amount)||0});
  });
  (DB.creditNotes||[]).filter(x=>x.customerId===c.id && x.status!=='cancelled').forEach(x=>{
    const inv = byId(DB.invoices,x.invoiceId);
    ent.push({date:x.date, type:'Credit Note', ref:x.number, det:inv?'Against '+inv.number:(x.reason||''), debit:0, credit:invoiceTotal(x)});
  });
  ent.sort((a,b)=>a.date.localeCompare(b.date) || rank[a.type]-rank[b.type]);
  const opening = from ? ent.filter(e=>e.date<from).reduce((s,e)=>s+e.debit-e.credit,0) : 0;
  const rows = ent.filter(e=>inR(e.date));
  let run = opening, D = 0, P = 0, C = 0;
  const out = rows.map(e=>{ run += e.debit - e.credit; D += e.debit; if(e.type==='Payment') P += e.credit; else C += e.credit; return [e.date, e.type+' '+e.ref, e.det, e.debit||null, e.credit||null, run]; });
  const body = [];
  if(from || Math.abs(opening)>0.005) body.push({b:true, c:['','Opening Balance','',null,null,opening]});
  const all = body.concat(out);
  if(out.length) all.push({b:true, c:['','Total','',D,P+C,run]});
  return { ...base,
    summary:[['Opening Balance',opening],['Invoiced',D],['Payments Received',P],['Credit Notes',C],['Balance Due',run]],
    sections:[{ empty:'No transactions in this period.',
      cols:[{h:'Date'},{h:'Transaction'},{h:'Details'},{h:'Invoiced',num:1},{h:'Received / Credited',num:1},{h:'Balance',num:1}],
      rows: out.length ? all : [] }] };
}

/* =========================================================
   2) INVOICE — Draft → Approved → Sent (Zoho style)
   ========================================================= */
function applyInvStatus(inv, to){
  const s = inv.status;
  if(to==='approved' && s==='draft'){ inv.status = 'approved'; inv.approvedOn = todayISO(); return 'Invoice approved'; }
  if(to==='sent' && s==='approved'){ inv.status = 'sent'; inv.sentOn = todayISO(); return 'Invoice marked as sent'; }
  if(to==='draft' && s==='approved'){
    if(invoicePaid(inv)>0){ toast('This invoice has payments — cannot move back to draft'); return null; }
    inv.status = 'draft'; delete inv.approvedOn; return 'Moved back to draft';
  }
  if(to==='draft' && s==='cancelled'){ inv.status = 'draft'; return 'Invoice reopened as draft'; }
  if(to==='cancelled' && s!=='cancelled'){
    if(invoicePaid(inv)>0 || invoiceCredits(inv)>0){ toast('Remove payments / credit notes first, then cancel'); return null; }
    if(!confirm('Cancel invoice '+inv.number+'?')) return null;
    inv.status = 'cancelled'; return 'Invoice cancelled';
  }
  return null;
}
function quickInvStatus(id, to){
  const inv = byId(DB.invoices,id); if(!inv) return;
  const msg = applyInvStatus(inv,to); if(!msg) return;
  saveDB(DB); refreshBackground(); toast(msg);
}
function invSetStatus(id, to){
  const inv = byId(DB.invoices,id); if(!inv) return;
  if(!saveInvoiceFromForm(inv,true)) return;
  const msg = applyInvStatus(inv,to);
  if(!msg){ return; }
  saveDB(DB); refreshBackground(); openInvoiceForm(id); toast(msg);
}
function invStepperHTML(inv){
  const s = inv.status, id = inv.id;
  if(s==='cancelled') return `<div class="stepper"><span class="badge b-cancelled">Cancelled</span><span class="spacer"></span><button type="button" class="btn btn-outline btn-sm" onclick="invSetStatus('${id}','draft')">Reopen as Draft</button></div>`;
  const idx = s==='draft' ? 0 : s==='approved' ? 1 : 2;
  const canRevert = idx===1 && invoicePaid(inv)<=0;
  const stp = (cls, label, act, tip) => act
    ? `<button type="button" class="stp ${cls}" title="${tip||''}" onclick="${act}">${label}</button>`
    : `<button type="button" class="stp ${cls}" disabled>${label}</button>`;
  let h = '<div class="stepper">';
  h += idx===0 ? stp('cur','Draft') : stp('done','✓ Draft', canRevert ? `invSetStatus('${id}','draft')` : '', 'Move back to draft');
  h += '<span class="arrow">›</span>';
  h += idx===0 ? stp('go','Mark as Approved',`invSetStatus('${id}','approved')`) : idx===1 ? stp('cur','Approved') : stp('done','✓ Approved');
  h += '<span class="arrow">›</span>';
  h += idx===0 ? stp('','Sent') : idx===1 ? stp('go','Mark as Sent',`invSetStatus('${id}','sent')`) : stp('cur','Sent');
  if(idx===2 && s!=='sent') h += `<span class="badge b-${s}" style="margin-left:6px;">${STATUS_LABEL[s]||s}</span>`;
  if(invoicePaid(inv)<=0 && invoiceCredits(inv)<=0) h += `<span class="spacer"></span><button type="button" class="btn btn-outline btn-sm" onclick="invSetStatus('${id}','cancelled')">Cancel Invoice</button>`;
  return h + '</div>';
}

/* =========================================================
   3) BANK / CASH — export to Excel / PDF
   ========================================================= */
function accountTxnSets(a, from, to){
  const all = DB.transactions.filter(t=>t.accountId===a.id).sort((x,y)=>x.date.localeCompare(y.date));
  const sgn = t => (t.type==='deposit' ? 1 : -1) * (Number(t.amount)||0);
  const opening = Number(a.opening||0) + all.filter(t=>from && t.date<from).reduce((s,t)=>s+sgn(t),0);
  return { opening, rows: all.filter(t=>(!from||t.date>=from) && (!to||t.date<=to)) };
}
function periodLabel(from,to){ return (from||to) ? ((from||'Beginning')+'  to  '+(to||'Today')) : 'All dates'; }
function accountModel(a, from, to){
  if(from && to && from>to){ const t=from; from=to; to=t; }
  const { opening, rows } = accountTxnSets(a, from, to);
  let run = opening, inn = 0, out = 0;
  const body = rows.map(t=>{ const amt = Number(t.amount)||0, isIn = t.type==='deposit'; run += isIn?amt:-amt; if(isIn) inn+=amt; else out+=amt; return [t.date, t.description||'', t.reference||'', isIn?amt:null, isIn?null:amt, run]; });
  const all = [{b:true,c:['','Opening Balance','',null,null,opening]}].concat(body);
  if(body.length) all.push({b:true,c:['','Total','',inn,out,run]});
  return { file:(ACC_TYPE_LABEL[a.type]||'Account')+'-'+a.name+'-'+todayISO(), title:(ACC_TYPE_LABEL[a.type]||'Account')+' Account Statement', sheet:'Account Statement',
    meta:[['Account',a.name],['Type',ACC_TYPE_LABEL[a.type]||a.type],[a.iban?'IBAN':'Account No.', a.iban||a.accountNo||'-'],['Currency',a.currency||'SAR'],['Period',periodLabel(from,to)]],
    summary:[['Opening Balance',opening],['Money In',inn],['Money Out',out],['Closing Balance',run]],
    sections:[{ cols:[{h:'Date'},{h:'Description'},{h:'Reference'},{h:'Money In',num:1},{h:'Money Out',num:1},{h:'Balance',num:1}], rows:all }] };
}
function allAccountsModel(kind, from, to){
  if(from && to && from>to){ const t=from; from=to; to=t; }
  const accts = DB.accounts.filter(a=>kind==='all' || a.type===kind);
  const title = kind==='bank' ? 'Bank Accounts Report' : kind==='cash' ? 'Cash Accounts Report' : 'Bank & Cash Accounts Report';
  let TI=0, TO=0, TC=0, TOP=0; const sumRows = [], txRows = [];
  accts.forEach(a=>{
    const { opening, rows } = accountTxnSets(a, from, to);
    let inn=0, out=0;
    rows.forEach(t=>{ const amt=Number(t.amount)||0, isIn=t.type==='deposit'; if(isIn) inn+=amt; else out+=amt;
      txRows.push([t.date, a.name, t.description||'', t.reference||'', isIn?amt:null, isIn?null:amt]); });
    const close = opening+inn-out; TI+=inn; TO+=out; TC+=close; TOP+=opening;
    sumRows.push([a.name, ACC_TYPE_LABEL[a.type]||a.type, opening, inn, out, close]);
  });
  txRows.sort((x,y)=>x[0].localeCompare(y[0]));
  if(sumRows.length) sumRows.push({b:true,c:['Total','',TOP,TI,TO,TC]});
  return { file:title.replace(/[ &]+/g,'-')+'-'+todayISO(), title, sheet:'Accounts',
    meta:[['Accounts', kind==='all'?'All accounts':(ACC_TYPE_LABEL[kind]||kind)+' accounts'],['Period',periodLabel(from,to)]],
    summary:[['Accounts',String(accts.length)],['Money In',TI],['Money Out',TO],['Total Balance',TC]],
    sections:[
      { heading:'Accounts Summary', empty:'No accounts of this type.', cols:[{h:'Account'},{h:'Type'},{h:'Opening',num:1},{h:'Money In',num:1},{h:'Money Out',num:1},{h:'Closing',num:1}], rows:sumRows },
      { heading:'Transactions', empty:'No transactions in this period.', cols:[{h:'Date'},{h:'Account'},{h:'Description'},{h:'Reference'},{h:'Money In',num:1},{h:'Money Out',num:1}], rows:txRows }
    ] };
}
function accExport(fmt){
