/* ---------- helpers ---------- */
function findOrCreateVendor(name){
  const n = name.trim().toLowerCase();
  let v = DB.vendors.find(x=>(x.companyName||'').toLowerCase()===n || (x.name||'').toLowerCase()===n);
  if(v) return {v, created:false};
  v = { id:uid(), name:name.trim(), companyName:'', phone:'', email:'', vat:'', crn:'', address:'', city:'', country:'Saudi Arabia', active:true, notes:'' };
  DB.vendors.push(v); return {v, created:true};
}
function vehKey(t){
  t = (t||'').trim(); if(!t) return '';
  const k = Object.keys(VEHICLE_LABEL).find(k=>VEHICLE_LABEL[k].toLowerCase()===t.toLowerCase() || k===t.toLowerCase());
  return k || t;
}
function linesFromRows(rows){ return rows.map(rowToLine).filter(Boolean).map(l=>({...l, vehicle:vehKey(l.vehicle)})); }
function normMethod(s){ s = (s||'').toLowerCase().trim().replace(/\s+/g,'_'); return ['bank_transfer','cash','cheque','card','other'].includes(s) ? s : (s?'other':'bank_transfer'); }
function catKey(s){
  s = (s||'').trim().toLowerCase(); if(!s) return 'other';
  return Object.keys(EXPENSE_CATS).find(k=>k===s || EXPENSE_CATS[k].toLowerCase()===s) || 'other';
}
function lineCols(l){ return l ? [l.description||'', VEHICLE_LABEL[l.vehicle]||l.vehicle||'', l.service||'', l.qty, l.rate, l.tax, lineAmount(l).toFixed(2)] : ['','','','','','','']; }

/* ---------- importers ---------- */
function importPaymentsReceived(rows){
  const R = {added:0, skipped:0, newCust:0, notes:[]};
  rows.forEach(o=>{
    const cust = pick(o,'customer','customer name'), amt = num(pick(o,'amount','amount received'));
    if(!cust || amt===null || amt<=0){ R.skipped++; return; }
    const no = pick(o,'payment no','payment number','number','no');
    if(no && DB.paymentsReceived.some(p=>p.number.toLowerCase()===no.toLowerCase())){ R.skipped++; R.notes.push('Payment '+no+' already exists — skipped'); return; }
    const cu = findOrCreateCustomer(cust); if(cu.created) R.newCust++;
    const invNo = pick(o,'invoice no','invoice number','applied to','invoice');
    let inv = invNo ? DB.invoices.find(i=>i.number.toLowerCase()===invNo.toLowerCase()) : null;
    if(invNo && !inv) R.notes.push((no||cust)+': invoice '+invNo+' not found — saved as advance');
    let amount = amt, extra = 0;
    if(inv){ const bal = invoiceBalance(inv);
      if(bal<=0.005){ R.notes.push((no||cust)+': invoice '+inv.number+' has no balance — saved as advance'); inv = null; }
      else if(amount>bal+0.005){ extra = amount-bal; amount = bal; } }
    const acName = pick(o,'deposit account','deposited to','account').toLowerCase();
    const ac = acName ? DB.accounts.find(a=>a.name.toLowerCase()===acName) : null;
    const base = { customerId:cu.c.id, date:normDate(pick(o,'date','payment date'), todayISO()), method:normMethod(pick(o,'method','payment method')), accountId:ac?ac.id:'', reference:pick(o,'reference') };
    const p = {...base, id:uid(), number:no || uniqueNo('PMT','payrecv',DB.paymentsReceived), invoiceId:inv?inv.id:'', amount};
    DB.paymentsReceived.push(p); syncPaymentTxn(p); bumpSeq('payrecv', no);
    if(extra>0){ const ex = {...base, id:uid(), number:uniqueNo('PMT','payrecv',DB.paymentsReceived), invoiceId:'', amount:extra, reference:'Excess of '+p.number}; DB.paymentsReceived.push(ex); syncPaymentTxn(ex); R.notes.push(p.number+': extra ﷼ '+money(extra)+' kept as advance'); }
    if(inv) syncInvoiceStatus(inv.id);
    R.added++;
  });
  return R;
}
function importCreditNotes(rows){
  const R = {added:0, skipped:0, newCust:0, notes:[]};
  groupRows(rows, ['credit note no','credit note number','credit note','number','no'], ['customer','customer name'], ['date']).forEach(g=>{
    const cust = firstOf(g.rows,'customer','customer name');
    if(!cust){ R.skipped++; return; }
    if(g.num && DB.creditNotes.some(c=>c.number.toLowerCase()===g.num.toLowerCase())){ R.skipped++; R.notes.push('Credit note '+g.num+' already exists — skipped'); return; }
    const lines = linesFromRows(g.rows);
    if(!lines.length){ R.skipped++; R.notes.push((g.num||cust)+': no line items — skipped'); return; }
    const cu = findOrCreateCustomer(cust); if(cu.created) R.newCust++;
    const invNo = firstOf(g.rows,'invoice no','invoice number','invoice');
    const inv = invNo ? DB.invoices.find(i=>i.number.toLowerCase()===invNo.toLowerCase()) : null;
    if(invNo && !inv) R.notes.push((g.num||cust)+': invoice '+invNo+' not found — kept as customer credit');
    DB.creditNotes.push({ id:uid(), number:g.num || uniqueNo('CN','creditnote',DB.creditNotes), customerId:cu.c.id, invoiceId:inv?inv.id:'',
      date:normDate(firstOf(g.rows,'date','credit note date'), todayISO()), reason:firstOf(g.rows,'reason'), status:'open', lines });
    bumpSeq('creditnote', g.num); R.added++;
  });
  DB.invoices.forEach(i=>syncInvoiceStatus(i.id));
  return R;
}
function importExpenses(rows){
  const R = {added:0, skipped:0, newVend:0, notes:[]};
  rows.forEach(o=>{
    const amt = num(pick(o,'amount','total'));
    if(amt===null || amt<=0){ R.skipped++; return; }
    const vn = pick(o,'vendor','vendor name'); let vid = '';
    if(vn){ const v = findOrCreateVendor(vn); vid = v.v.id; if(v.created) R.newVend++; }
    DB.expenses.push({ id:uid(), date:normDate(pick(o,'date','expense date'), todayISO()), category:catKey(pick(o,'category')), vendorId:vid, amount:amt, description:pick(o,'description','notes') });
    R.added++;
  });
  return R;
}
function importBills(rows){
  const R = {added:0, skipped:0, newVend:0, notes:[]};
  groupRows(rows, ['bill no','bill number','bill','number','no'], ['vendor','vendor name'], ['date','bill date']).forEach(g=>{
    const vn = firstOf(g.rows,'vendor','vendor name');
    if(!vn){ R.skipped++; return; }
    if(g.num && DB.bills.some(b=>b.number.toLowerCase()===g.num.toLowerCase())){ R.skipped++; R.notes.push('Bill '+g.num+' already exists — skipped'); return; }
    const lines = linesFromRows(g.rows);
    if(!lines.length){ R.skipped++; R.notes.push((g.num||vn)+': no line items — skipped'); return; }
    const vv = findOrCreateVendor(vn); if(vv.created) R.newVend++;
    const date = normDate(firstOf(g.rows,'date','bill date'), todayISO());
    let terms = firstOf(g.rows,'terms').toLowerCase().replace(/\s+/g,'_'); if(!TERMS_LABEL[terms]) terms = 'net_30';
    DB.bills.push({ id:uid(), number:g.num || uniqueNo('BILL','bill',DB.bills), vendorId:vv.v.id, poRef:firstOf(g.rows,'order po reference','po reference','po'), date,
      dueDate:normDate(firstOf(g.rows,'due date'), addDays(date, TERMS_DAYS_MAP[terms])), terms,
      status:normStatus(firstOf(g.rows,'status'), ['draft','open','partial','paid','overdue','cancelled'], 'open'), notes:firstOf(g.rows,'notes'), lines });
    bumpSeq('bill', g.num); R.added++;
  });
  return R;
}
function importPaymentsMade(rows){
  const R = {added:0, skipped:0, newVend:0, notes:[]};
  rows.forEach(o=>{
    const vn = pick(o,'vendor','vendor name'), amt = num(pick(o,'amount'));
    if(!vn || amt===null || amt<=0){ R.skipped++; return; }
    const no = pick(o,'payment no','payment number','number','no');
    if(no && DB.paymentsMade.some(p=>p.number.toLowerCase()===no.toLowerCase())){ R.skipped++; R.notes.push('Payment '+no+' already exists — skipped'); return; }
    const vv = findOrCreateVendor(vn); if(vv.created) R.newVend++;
    const bn = pick(o,'bill no','bill number','bill');
    const bill = bn ? DB.bills.find(b=>b.number.toLowerCase()===bn.toLowerCase()) : null;
    if(bn && !bill) R.notes.push((no||vn)+': bill '+bn+' not found — saved without a bill');
    DB.paymentsMade.push({ id:uid(), number:no || uniqueNo('PMT','paymade',DB.paymentsMade), vendorId:vv.v.id, billId:bill?bill.id:'',
      date:normDate(pick(o,'date','payment date'), todayISO()), amount:amt, method:normMethod(pick(o,'method')), reference:pick(o,'reference') });
    bumpSeq('paymade', no); R.added++;
  });
  return R;
}
function importCoa(rows){
  const R = {added:0, updated:0, skipped:0, notes:[]};
  rows.forEach(o=>{
    const name = pick(o,'account name','name','account');
    if(!name){ R.skipped++; return; }
    if(SYSTEM_ACCOUNTS.some(s=>s[1].toLowerCase()===name.toLowerCase())){ R.skipped++; R.notes.push('"'+name+'" is a built-in account — skipped'); return; }
    const tl = pick(o,'type','account type').toLowerCase();
    const type = Object.keys(ACCT_TYPES).find(k=>k!=='other' && (k===tl || ACCT_TYPES[k].toLowerCase()===tl)) || 'expense';
    const op = num(pick(o,'opening balance','opening')), code = pick(o,'code');
    const ex = DB.coa.find(a=>a.name.toLowerCase()===name.toLowerCase());
    if(ex){ if(code) ex.code = code; if(tl) ex.type = type; if(op!==null) ex.opening = op; R.updated++; }
    else { DB.coa.push({ id:uid(), code, name, type, opening:op===null?0:op }); R.added++; }
  });
  return R;
}
function importJournals(rows){
  const R = {added:0, skipped:0, notes:[]};
  groupRows(rows, ['journal no','journal number','journal','number','no'], ['reference'], ['date']).forEach(g=>{
    if(g.num && DB.journals.some(j=>j.number.toLowerCase()===g.num.toLowerCase())){ R.skipped++; R.notes.push('Journal '+g.num+' already exists — skipped'); return; }
    const lines = g.rows.map(o=>{
      const acc = pick(o,'account','account name'), d = num(pick(o,'debit')), c = num(pick(o,'credit'));
      if(!acc || (!d && !c)) return null;
      return { id:uid(), account:acc, description:pick(o,'description'), debit:d||0, credit:c||0 };
    }).filter(Boolean);
    if(lines.length<2){ R.skipped++; R.notes.push((g.num||'A journal')+': needs at least 2 lines — skipped'); return; }
    const dr = lines.reduce((s,l)=>s+l.debit,0), cr = lines.reduce((s,l)=>s+l.credit,0);
    if(Math.abs(dr-cr)>0.005){ R.skipped++; R.notes.push((g.num||'A journal')+': debit ('+money(dr)+') ≠ credit ('+money(cr)+') — skipped'); return; }
    DB.journals.push({ id:uid(), number:g.num || uniqueNo('JNL','journal',DB.journals), date:normDate(firstOf(g.rows,'date'), todayISO()), reference:firstOf(g.rows,'reference'), notes:firstOf(g.rows,'notes'), lines });
    bumpSeq('journal', g.num); R.added++;
  });
  return R;
}

        (c.lines&&c.lines.length?c.lines:[null]).forEach(l=>rows.push(head.concat(lineCols(l), [invoiceTotal(c).toFixed(2)]))); }); return rows; },
    expenses(){ return DB.expenses.length && [EXP_COLS].concat(DB.expenses.map(x=>[x.date, EXPENSE_CATS[x.category]||x.category, x.vendorId?vendorName(x.vendorId):'', Number(x.amount||0).toFixed(2), x.description||''])); },
    bills(){ if(!DB.bills.length) return 0; let rows = [BILL_COLS];
      DB.bills.forEach(b=>{ const head = [b.number, vendorName(b.vendorId), b.poRef||'', b.date, b.dueDate, TERMS_LABEL[b.terms]||b.terms||'', STATUS_LABEL[b.status]||b.status, b.notes||''];
        (b.lines&&b.lines.length?b.lines:[null]).forEach(l=>rows.push(head.concat(lineCols(l), [invoiceTotal(b).toFixed(2), billPaid(b).toFixed(2), billBalance(b).toFixed(2)]))); }); return rows; },
    paymentsMade(){ return DB.paymentsMade.length && [PM_COLS].concat(DB.paymentsMade.map(p=>{ const b = byId(DB.bills,p.billId); return [p.number, vendorName(p.vendorId), b?b.number:'', p.date, Number(p.amount||0).toFixed(2), (p.method||'').replace('_',' '), p.reference||'']; })); },
    coa(){ return [COA_COLS].concat(buildLedger().map(a=>[a.code||'', a.name, ACCT_TYPES[a.type]||a.type, a.custom?(Number(a.opening)||0).toFixed(2):'', a.net.toFixed(2), a.custom?'Custom':'System'])); },
    journals(){ if(!DB.journals.length) return 0; let rows = [JNL_COLS];
      DB.journals.forEach(j=>j.lines.forEach(l=>rows.push([j.number, j.date, j.reference||'', j.notes||'', l.account, l.description||'', Number(l.debit||0).toFixed(2), Number(l.credit||0).toFixed(2)]))); return rows; }
  };
  if(!F[kind]) return _exportKind(kind);
  const rows = F[kind]();
  if(!rows){ toast('Nothing to export in '+IO[kind].label); return; }
  downloadCSV(kind+'_'+todayISO()+'.csv', rows); toast('Export downloaded');
};

/* ---------- import runner (handles old + new kinds) ---------- */
runImport = function(kind){
  const f = document.getElementById('ioFile').files[0];
  if(!f){ toast('Choose a CSV file first'); return; }
  const rd = new FileReader();
  rd.onload = function(){
    let rows; try { rows = parseCSV(String(rd.result)); } catch(e){ toast('Could not read this file'); return; }
    if(!rows.length){ toast('No data rows found in the file'); return; }
    const c = IO[kind];
    const R = c.run ? c.run(rows) : (kind==='customers' ? importCustomers(rows) : kind==='quotes' ? importQuotes(rows) : importInvoices(rows));
    saveDB(DB);
    const parts = ['<b>'+R.added+'</b> added'];
    if(R.updated!==undefined) parts.push('<b>'+R.updated+'</b> updated');
    parts.push('<b>'+R.skipped+'</b> skipped');
    if(R.newCust) parts.push('<b>'+R.newCust+'</b> new customer(s) created');
    if(R.newVend) parts.push('<b>'+R.newVend+'</b> new vendor(s) created');
    openModal(`
      <div class="modal-head"><h2>Import complete</h2><button class="modal-close" onclick="closeModal();navigate('${c.page}')">&times;</button></div>
      <p>${parts.join(' &nbsp;•&nbsp; ')}</p>
      ${R.notes.length ? '<ul style="font-size:.85rem;color:var(--muted);">'+R.notes.slice(0,10).map(n=>'<li>'+esc(n)+'</li>').join('')+(R.notes.length>10?'<li>…and '+(R.notes.length-10)+' more</li>':'')+'</ul>' : ''}
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal();navigate('${c.page}')">Done</button></div>`);
  };
  rd.readAsText(f);
};

/* ---------- add ⬆ Import / ⬇ Export buttons to the 7 pages ---------- */
function withIO(page, kind){
  const orig = RENDERERS[page];
  RENDERERS[page] = function(el, q){
    orig.call(this, el, q);
    const tb = el.querySelector('.toolbar'); if(!tb || tb.querySelector('[data-io]')) return;
    const main = tb.querySelector('.btn-primary');
    const wrap = document.createElement('div');
    wrap.setAttribute('data-io','1'); wrap.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
    wrap.innerHTML = `<button class="btn btn-outline" onclick="importKind('${kind}')">⬆ Import</button><button class="btn btn-outline" onclick="exportKind('${kind}')">⬇ Export</button>`;
    if(main){ main.parentNode.insertBefore(wrap, main); wrap.appendChild(main); } else tb.appendChild(wrap);
  };
}
['paymentsReceived','creditNotes','expenses','bills','paymentsMade','coa','journals'].forEach(k=>withIO(k,k));

/* ---------- Click-to-sort on every table header (A→Z, then Z→A) ---------- */
(function(){
  const st = document.createElement('style');
  st.textContent = `
    th.az-sort{cursor:pointer;user-select:none;}
    th.az-sort:hover{filter:brightness(.94);}
    th.az-sort::after{content:'⇅';opacity:.35;font-size:.75em;margin-left:6px;}
    th.az-sort[data-dir="asc"]::after{content:'▲';opacity:.9;}
    th.az-sort[data-dir="desc"]::after{content:'▼';opacity:.9;}
    @media print{th.az-sort::after{content:'' !important;}}`;
  document.head.appendChild(st);

  const coll = new Intl.Collator(undefined,{numeric:true, sensitivity:'base'});
  const isSortable = t => {
    if(t.closest('.modal, #modal, .modal-box')) { if(t.querySelector('input,select,textarea')) return false; }
    if(t.querySelector('tbody input, tbody select, tbody textarea')) return false;   // editable form tables
    return true;
  };
  function headerRow(t){
    const tr = t.tHead && t.tHead.rows[0]; if(tr) return tr;
    const first = t.rows[0]; return first && first.querySelector('th') && !first.querySelector('td') ? first : null;
  }
  function dataRows(t, hr){
    const body = t.tBodies.length ? [...t.tBodies].flatMap(b=>[...b.rows]) : [...t.rows];
    return body.filter(r=>r!==hr && !r.querySelector('th') && !r.classList.contains('empty-row'));
  }
  function keyOf(td){
    let s = (td ? td.textContent : '').replace(/\s+/g,' ').trim();
    if(!s || s==='—' || s==='-') return {e:true};
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return {s};
    const m = s.replace(/[﷼,\s]/g,'').match(/^\(?(-?\d+(?:\.\d+)?)\)?(Dr|Cr|%)?$/i);
    if(m){ let n = parseFloat(m[1]); if(/^cr$/i.test(m[2]||'')) n = -n; return {n}; }
    return {s};
  }
  function cmp(a,b){
    if(a.e && b.e) return 0; if(a.e) return 1; if(b.e) return -1;     // blanks always last
    if(a.n!==undefined && b.n!==undefined) return a.n-b.n;
    return coll.compare(a.n!==undefined?String(a.n):a.s, b.n!==undefined?String(b.n):b.s);
  }
  function sortTable(t, ci, th){
    const hr = headerRow(t); if(!hr) return;
    const dir = th.dataset.dir==='asc' ? 'desc' : 'asc';
    [...hr.cells].forEach(c=>{ delete c.dataset.dir; });
    th.dataset.dir = dir;
    const rows = dataRows(t, hr);
    const pinned = rows.filter(r=>[...r.cells].some(c=>c.colSpan>1) && r.cells.length<hr.cells.length);   // total / note rows stay at the bottom
    const sortable = rows.filter(r=>!pinned.includes(r));
    const keyed = sortable.map((r,i)=>({r, i, k:keyOf(r.cells[ci])}));
    keyed.sort((x,y)=>{ const c = cmp(x.k,y.k); return (x.k.e||y.k.e) ? c : (dir==='asc'?c:-c) || (x.i-y.i); });
    const host = sortable.length ? sortable[0].parentNode : null; if(!host) return;
    const anchor = pinned.length ? pinned[0] : null;
    keyed.forEach(o=>host.insertBefore(o.r, anchor && anchor.parentNode===host ? anchor : null));
  }
  function decorate(root){
    (root||document).querySelectorAll('table').forEach(t=>{
      if(t.dataset.azInit || !isSortable(t)) return;
      const hr = headerRow(t); if(!hr) return;
      t.dataset.azInit = '1';
      [...hr.cells].forEach(th=>{ if(th.textContent.trim()) th.classList.add('az-sort'); });
    });
  }
  document.addEventListener('click', function(e){
    const th = e.target.closest('th.az-sort'); if(!th) return;
    const t = th.closest('table'), hr = headerRow(t); if(!t || !hr || th.parentNode!==hr) return;
    sortTable(t, th.cellIndex, th);
  });
  new MutationObserver(()=>decorate(document)).observe(document.body,{childList:true, subtree:true});
  decorate(document);
})();

  function renderAZBS(out,asOf){
    const l=buildLedger(asOf), get=n=>{const v=l[n]||{};return num(v.dr)-num(v.cr);};
    const assets=[['Cash',get('Cash')],['Bank',get('Bank')],['Accounts Receivable',get('Accounts Receivable')],['VAT Receivable',get('VAT Receivable')]];
    const liab=[['Accounts Payable',-get('Accounts Payable')],['VAT Payable',-get('VAT Payable')],['Customer Advances',-get('Customer Advances')],['Vendor Advances',get('Vendor Advances')]];
    const income=['Sales Revenue','Other Income'].reduce((s,n)=>s-get(n),0);
    const expenses=['Purchases (Bills)','Fuel Expense','Vehicle Maintenance Expense','Salary Expense','Rent Expense','Insurance Expense','Office Supplies Expense','Other Expense','Sales Returns (Credit Notes)'].reduce((s,n)=>s+get(n),0);
    const equity=get('Opening Balance Equity')+income-expenses;
    const rows=[...assets.map(x=>[x[0],'Asset',x[1]]),...liab.map(x=>[x[0],'Liability',x[1]]),['Current Earnings','Equity',equity]];
    out.innerHTML=`<div class="toolbar"><h3 style="margin:0">Balance Sheet</h3><span class="text-muted">As of ${asOf}</span></div><div class="table-wrap"><table><thead><tr><th>Account</th><th>Type</th><th class="text-end">Balance (SAR)</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#" onclick="event.preventDefault();azDrillAccount('${String(r[0]).replace(/'/g,"\\'")}','','${asOf}')">${escA(r[0])}</a></td><td>${r[1]}</td><td class="text-end">${money(r[2])}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function renderAZSalesCustomer(out,from,to){
    const map={};DB.invoices.filter(x=>liveDoc(x)&&x.date>=from&&x.date<=to).forEach(x=>{const k=x.customerId;map[k]=(map[k]||0)+baseTotal(x);});
    DB.creditNotes.filter(x=>x.status!=='cancelled'&&x.date>=from&&x.date<=to).forEach(x=>{const k=x.customerId;map[k]=(map[k]||0)-baseTotal(x);});
    const rows=Object.entries(map).map(([id,v])=>[customerName(id),v,id]).sort((a,b)=>b[1]-a[1]);
    out.innerHTML=`<div class="toolbar"><h3 style="margin:0">Sales by Customer</h3><span class="text-muted">${from} to ${to}</span></div><table><thead><tr><th>Customer</th><th class="text-end">Sales (SAR)</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#" onclick="event.preventDefault();azDrillCustomer('${r[2]}','${from}','${to}')">${escA(r[0])}</a></td><td class="text-end">${money(r[1])}</td></tr>`).join('')}</tbody></table>`;
  }
  window.azDrillCustomer=function(id,from,to){
    const rs=[];DB.invoices.filter(x=>x.customerId===id&&liveDoc(x)&&x.date>=from&&x.date<=to).forEach(x=>rs.push([x.date,x.number,'Invoice',docCur(x),money(invoiceTotal(x)),money(baseTotal(x))]));
    DB.creditNotes.filter(x=>x.customerId===id&&x.status!=='cancelled'&&x.date>=from&&x.date<=to).forEach(x=>rs.push([x.date,x.number,'Credit Note',docCur(x),money(invoiceTotal(x)),money(-baseTotal(x))]));
    azDrill('Sales Detail — '+customerName(id),rs,[{h:'Date'},{h:'Reference'},{h:'Type'},{h:'Currency'},{h:'Amount'},{h:'Amount SAR'}]);
  };
  function renderAZAging(out,type,asOf){
    const isAR=type==='ar', items=isAR?DB.invoices.filter(x=>liveDoc(x)&&x.date<=asOf):DB.bills.filter(x=>liveDoc(x)&&x.date<=asOf);
    const rows=[];items.forEach(x=>{const bal=isAR?invoiceBalance(x):billBalance(x);if(bal<=0)return;const due=x.dueDate||x.date;const days=Math.max(0,Math.floor((new Date(asOf)-new Date(due))/86400000));const bucket=days<=0?'Current':days<=30?'1-30':days<=60?'31-60':days<=90?'61-90':'90+';rows.push([isAR?customerName(x.customerId):vendorName(x.vendorId),x.number,due,bucket,baseTotal(x),bal*fxRate(x),x.id]);});
    out.innerHTML=`<div class="toolbar"><h3 style="margin:0">${isAR?'Customer':'Vendor'} Aging</h3><span class="text-muted">As of ${asOf}</span></div><table><thead><tr><th>${isAR?'Customer':'Vendor'}</th><th>Document</th><th>Due Date</th><th>Bucket</th><th class="text-end">Original SAR</th><th class="text-end">Balance SAR</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escA(r[0])}</td><td><a href="#" onclick="event.preventDefault();azAgingDrill('${r[6]}','${type}','${asOf}')">${escA(r[1])}</a></td><td>${r[2]}</td><td>${r[3]}</td><td class="text-end">${money(r[4])}</td><td class="text-end">${money(r[5])}</td></tr>`).join('')}</tbody></table>`;
  }

  window.azAgingDrill=function(id,type,asOf){
    const isAR=type==='ar', x=isAR?byId(DB.invoices,id):byId(DB.bills,id);
    if(!x)return;
    const party=isAR?customerName(x.customerId):vendorName(x.vendorId);
    const rows=[[x.date,x.number,isAR?'Invoice':'Bill',party,docCur(x),money(invoiceTotal(x)),money((isAR?invoiceBalance(x):billBalance(x))*fxRate(x))]];
    azDrill((isAR?'AR Aging':'AP Aging')+' — '+x.number,rows,[{h:'Date'},{h:'Document'},{h:'Type'},{h:'Party'},{h:'Currency'},{h:'Original'},{h:'Balance SAR'}]);
  };

  function renderAZVendor(out,from,to){
    const map={};DB.bills.filter(x=>liveDoc(x)&&x.date>=from&&x.date<=to).forEach(x=>{map[x.vendorId]=(map[x.vendorId]||0)+baseTotal(x);});
    DB.paymentsMade.filter(x=>x.date>=from&&x.date<=to).forEach(x=>{map[x.vendorId]=(map[x.vendorId]||0)-basePayment(x);});
    const rows=Object.entries(map).map(([id,v])=>[vendorName(id),v,id]).sort((a,b)=>b[1]-a[1]);
    out.innerHTML=`<div class="toolbar"><h3 style="margin:0">Vendor Balance Summary</h3><span class="text-muted">${from} to ${to}</span></div><table><thead><tr><th>Vendor</th><th class="text-end">Balance (SAR)</th></tr></thead><tbody>${rows.map(r=>`<tr><td><a href="#" onclick="event.preventDefault();azDrillVendor('${r[2]}','${from}','${to}')">${escA(r[0])}</a></td><td class="text-end">${money(r[1])}</td></tr>`).join('')}</tbody></table>`;
  }
  window.azDrillVendor=function(id,from,to){
    const rs=[];DB.bills.filter(x=>x.vendorId===id&&liveDoc(x)&&x.date>=from&&x.date<=to).forEach(x=>rs.push([x.date,x.number,'Bill',docCur(x),money(baseTotal(x))]));
    DB.paymentsMade.filter(x=>x.vendorId===id&&x.date>=from&&x.date<=to).forEach(x=>rs.push([x.date,x.number,'Payment',docCur(x),money(-basePayment(x))]));
    azDrill('Vendor Detail — '+vendorName(id),rs,[{h:'Date'},{h:'Reference'},{h:'Type'},{h:'Currency'},{h:'Amount SAR'}]);
  };

  const _showReport2=showReport;
  RENDERERS.reports=renderAZReports;

  /* ---------- Currency Exchange management in Settings ---------- */
  const oldSettings=RENDERERS.settings;
  RENDERERS.settings=function(el){
    oldSettings(el);
    const card=`<div class="card mt-2"><h3 style="margin-top:0">Currency Exchange</h3><p class="text-muted" style="font-size:.8rem">Maintain your working exchange rates to SAR. These are used on customer/vendor documents and journal base amounts.</p>
      <div class="table-wrap"><table><thead><tr><th>Currency</th><th>Rate to SAR</th><th></th></tr></thead><tbody>${AZ_CURRENCIES.map(c=>`<tr><td>${c}</td><td><input id="azfx_${c}" type="number" step="0.000001" value="${num((DB.fxRates||{})[c])||(c===AZ_BASE?1:1)}"></td><td>${c===AZ_BASE?'Base currency':''}</td></tr>`).join('')}</tbody></table></div>
      <div class="modal-actions" style="border-top:0"><button class="btn btn-primary" onclick="azSaveFx()">Save Exchange Rates</button></div></div>`;
    el.insertAdjacentHTML('beforeend',card);
  };
  window.azSaveFx=function(){DB.fxRates=DB.fxRates||{};AZ_CURRENCIES.forEach(c=>DB.fxRates[c]=num(document.getElementById('azfx_'+c)?.value)||1);DB.fxRates[AZ_BASE]=1;saveDB(DB);toast('Exchange rates saved');};

  /* ---------- normalize new fields ---------- */
  DB.fxRates=DB.fxRates||{};DB.fxRates[AZ_BASE]=1;
  [...(DB.customers||[]),...(DB.vendors||[])].forEach(x=>{x.currency=x.currency||AZ_BASE;x.exchangeRate=fxRate(x);});
  [...(DB.invoices||[]),...(DB.bills||[]),...(DB.creditNotes||[]),...(DB.paymentsReceived||[]),...(DB.paymentsMade||[]),...(DB.expenses||[])].forEach(x=>{x.currency=x.currency||AZ_BASE;x.exchangeRate=fxRate(x);});
  saveDB(DB);
})();

</script>
</body>
</html>
